<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1C2A24">
<title>Marco — levantamento GNSS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/proj4@2.11.0/dist/proj4.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{
  --ground:#E9EDE4; --surface:#FFFFFF; --surface2:#F4F6F1; --ink:#1C2A24; --ink2:#55635C; --line:#CFD6CB;
  --signal:#F2C200; --signal-ink:#1C2A24; --good:#23874D; --fair:#C27E00; --poor:#C23B2A;
  --feat:#2A6FB0; --pos:#1F6FEB; --grid:rgba(28,42,36,.09); --scrim:rgba(18,26,22,.45);
  --r-s:8px; --r-m:14px; --r-l:22px;
  --font:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --font-c:"Barlow Condensed","Barlow",system-ui,"Arial Narrow",sans-serif;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0A0F0C; --surface:#151C18; --surface2:#1B241F; --ink:#E6ECE7; --ink2:#9BA9A1; --line:#2A3530;
    --signal:#F2C200; --signal-ink:#14110A; --good:#3DBA6F; --fair:#E5A21C; --poor:#E86452;
    --feat:#74AEE6; --pos:#5B9BFF; --grid:rgba(230,236,231,.07); --scrim:rgba(0,0,0,.6); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#000000; --surface:#111613; --surface2:#171E1A; --ink:#E6ECE7; --ink2:#9BA9A1; --line:#26302B;
  --signal:#F2C200; --signal-ink:#14110A; --good:#3DBA6F; --fair:#E5A21C; --poor:#E86452;
  --feat:#74AEE6; --pos:#5B9BFF; --grid:rgba(230,236,231,.07); --scrim:rgba(0,0,0,.6); color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{height:100%;margin:0;background:var(--ground);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.4;
  display:grid;grid-template-rows:auto 1fr auto;overflow:hidden;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:3px solid var(--pos);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none !important}

/* status bar */
#status{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--surface);border-bottom:1px solid var(--line);z-index:5}
#gchip{display:flex;align-items:center;gap:8px;min-height:44px;padding:4px 12px 4px 8px;border-radius:999px;background:var(--surface2);flex:1;min-width:0}
#gdot{width:14px;height:14px;border-radius:50%;background:var(--ink2);flex:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--ink2) 20%,transparent)}
#gchip[data-q="good"] #gdot{background:var(--good);box-shadow:0 0 0 3px color-mix(in srgb,var(--good) 25%,transparent)}
#gchip[data-q="fair"] #gdot{background:var(--fair);box-shadow:0 0 0 3px color-mix(in srgb,var(--fair) 25%,transparent)}
#gchip[data-q="poor"] #gdot{background:var(--poor);box-shadow:0 0 0 3px color-mix(in srgb,var(--poor) 25%,transparent)}
#gacc{font-family:var(--font-c);font-weight:700;font-size:24px;line-height:1;letter-spacing:.2px}
#glabel{font-size:13px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#gbars{display:flex;gap:2px;align-items:flex-end;height:16px;margin-left:auto}
#gbars i{width:4px;background:var(--line);border-radius:1px}
#gbars i:nth-child(1){height:5px}#gbars i:nth-child(2){height:9px}#gbars i:nth-child(3){height:12px}#gbars i:nth-child(4){height:16px}
#gbars i.on{background:currentColor}
.sbtn{min-width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--surface2);font-weight:600;font-size:13px;padding:0 10px}
.sbtn svg{width:22px;height:22px}
#syncDot{position:relative}
#syncDot[data-s="pending"]::after,#syncDot[data-s="error"]::after{content:"";position:absolute;top:8px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--fair)}
#syncDot[data-s="error"]::after{background:var(--poor)}

/* views */
main{position:relative;overflow:hidden;min-height:0}
.view{position:absolute;inset:0;overflow:auto;-webkit-overflow-scrolling:touch}
#v-map{overflow:hidden}
#map{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;background:var(--ground)}
#adv{position:absolute;left:8px;right:8px;top:8px;background:color-mix(in srgb,var(--surface) 94%,transparent);border-radius:var(--r-m);padding:8px 12px;
  display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px 12px;font-size:12px;border:1px solid var(--line);z-index:2}
#adv div{display:flex;flex-direction:column;min-width:0}
#adv span{color:var(--ink2)}
#adv b{font-family:var(--font-c);font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#cross{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;pointer-events:none;z-index:1}
#mapbtns{position:absolute;right:10px;bottom:calc(var(--dockH,200px) + 12px);display:flex;flex-direction:column;gap:8px;z-index:2}
.mbtn{width:48px;height:48px;border-radius:14px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.mbtn svg{width:24px;height:24px}
.mbtn[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
#scale{position:absolute;left:12px;bottom:calc(var(--dockH,200px) + 14px);font-size:12px;font-weight:600;z-index:2;pointer-events:none}
#scale i{display:block;height:6px;border:2px solid var(--ink);border-top:0;margin-top:2px}
#north{position:absolute;left:12px;bottom:calc(var(--dockH,200px) + 44px);width:28px;height:28px;z-index:2;pointer-events:none}

/* dock */
#dock{position:absolute;left:0;right:0;bottom:0;padding:10px 10px 12px;z-index:3;display:flex;flex-direction:column;gap:8px;
  background:linear-gradient(to top,var(--ground) 70%,transparent)}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:3px;gap:3px}
.seg button{flex:1;min-height:44px;border-radius:11px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px;font-size:15px}
.seg button svg{width:20px;height:20px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
#dockRow{display:flex;gap:8px;align-items:stretch}
#layerChip{flex:1;min-width:0;min-height:56px;border-radius:14px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 12px;text-align:left}
#layerChip .sw{width:16px;height:16px;border-radius:4px;flex:none}
#layerChip small{display:block;color:var(--ink2);font-size:12px;line-height:1.1}
#layerChip strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;line-height:1.2}
#collect{position:relative;flex:none;width:132px;min-height:56px;border-radius:16px;background:var(--signal);color:var(--signal-ink);font-weight:700;font-size:18px;
  display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 3px 0 color-mix(in srgb,var(--signal) 60%,#000),0 4px 14px rgba(0,0,0,.18);overflow:hidden}
#collect:active{transform:translateY(2px);box-shadow:0 1px 0 color-mix(in srgb,var(--signal) 60%,#000)}
#collect svg{width:24px;height:24px}
#collect .prog{position:absolute;left:0;bottom:0;height:5px;background:var(--signal-ink);width:0;transition:width .15s}
#collect[disabled]{opacity:.55}
.bar{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.bar .info{flex:1 1 100%;font-size:14px;padding:2px 4px 4px;display:flex;flex-wrap:wrap;gap:4px 14px}
.bar .info b{font-family:var(--font-c);font-size:19px;font-weight:600}
.btn{min-height:44px;padding:0 14px;border-radius:12px;font-weight:600;background:var(--surface2);border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btn.signal{background:var(--signal);color:var(--signal-ink);border-color:transparent}
.btn.danger{color:var(--poor)}
.btn.grow{flex:1}
.btn svg{width:20px;height:20px}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--surface)}

/* stakeout panel */
#stk{position:absolute;left:8px;right:8px;top:8px;z-index:3;background:var(--surface);border-radius:var(--r-l);border:1px solid var(--line);padding:12px;box-shadow:0 6px 20px rgba(0,0,0,.18)}
#stk .top{display:flex;align-items:center;gap:12px}
#stkArrow{width:84px;height:84px;flex:none}
#stkDist{font-family:var(--font-c);font-weight:700;font-size:52px;line-height:.95}
#stkName{font-size:13px;color:var(--ink2)}
#stkDir{font-size:15px;margin-top:4px}
#stk.arrived{background:color-mix(in srgb,var(--good) 18%,var(--surface));border-color:var(--good)}
#stk .row{display:flex;gap:6px;margin-top:10px}

/* tab bar */
#tabs{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--line);z-index:5}
#tabs button{min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:600;color:var(--ink2)}
#tabs button svg{width:24px;height:24px}
#tabs button[aria-selected="true"]{color:var(--ink)}
#tabs button[aria-selected="true"] svg{color:var(--ink);background:var(--signal);border-radius:10px;padding:2px 10px;box-sizing:content-box}

/* pages */
.page{max-width:720px;margin:0 auto;padding:16px 14px 32px}
.page h1{font-family:var(--font-c);font-weight:700;font-size:30px;line-height:1.1;margin:4px 0 14px}
.page h2{font-size:15px;font-weight:600;color:var(--ink2);margin:22px 4px 8px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);overflow:hidden}
.item{display:flex;align-items:center;gap:12px;min-height:56px;padding:10px 14px;width:100%;text-align:left;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .t{flex:1;min-width:0}
.item .t strong{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .t small{display:block;color:var(--ink2);font-size:13px}
.item .sw{width:14px;height:14px;border-radius:4px;flex:none}
.item svg{width:22px;height:22px;flex:none;color:var(--ink2)}
.tag{font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);color:var(--ink2)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.empty{padding:24px 16px;text-align:center;color:var(--ink2)}
.empty strong{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}

/* forms */
label.f{display:block;margin:0 0 12px}
label.f>span{display:block;font-size:13px;font-weight:600;color:var(--ink2);margin:0 0 4px 2px}
input.i,select.i,textarea.i{width:100%;min-height:48px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);font-size:16px}
textarea.i{min-height:120px;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface2);font-weight:600}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;padding:8px 14px;border-bottom:1px solid var(--line)}
.switch:last-child{border-bottom:0}
.switch small{display:block;color:var(--ink2);font-size:13px}
.switch input[type=checkbox]{appearance:none;width:52px;height:32px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .15s}
.switch input[type=checkbox]::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch input[type=checkbox]:checked{background:var(--good)}
.switch input[type=checkbox]:checked::after{transform:translateX(20px)}
.switch select{min-height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);padding:0 8px;max-width:55%}
.result{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0 12px}
.result dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0}
.result dt{color:var(--ink2);font-size:14px}
.result dd{margin:0;font-family:var(--font-c);font-weight:600;font-size:18px;text-align:right;font-variant-numeric:tabular-nums;word-break:break-all}
.note{font-size:13px;color:var(--ink2);margin:6px 2px 12px}
.err{color:var(--poor);font-weight:600;font-size:14px;margin:4px 2px 10px}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:4px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl input{width:78px;min-height:38px;border-radius:8px;border:1px solid var(--line);background:var(--surface);padding:4px 6px;text-align:right}
.tbl td:first-child input{width:72px;text-align:left}

/* sheet */
#scrim{position:fixed;inset:0;background:var(--scrim);z-index:20}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--surface);border-radius:var(--r-l) var(--r-l) 0 0;max-height:88%;display:flex;flex-direction:column;
  padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -8px 30px rgba(0,0,0,.25);max-width:720px;margin:0 auto;animation:up .18s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){#sheet{animation:none}}
#sheet .grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 0}
#sheet header{display:flex;align-items:center;gap:8px;padding:6px 8px 6px 18px}
#sheet header h2{flex:1;margin:0;font-family:var(--font-c);font-weight:700;font-size:24px;line-height:1.15}
#sheetClose{width:44px;height:44px;border-radius:12px;font-size:26px;line-height:1;color:var(--ink2)}
#sheetBody{overflow:auto;padding:4px 18px 18px;-webkit-overflow-scrolling:touch}

/* toast */
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 74px);z-index:30;background:var(--ink);color:var(--surface);
  border-radius:14px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:12px;max-width:min(92vw,520px);box-shadow:0 6px 20px rgba(0,0,0,.3);font-weight:500}
#toast.err{background:var(--poor);color:#fff}
#toast button{min-height:40px;padding:0 12px;border-radius:10px;font-weight:700;color:var(--signal)}
#toast.err button{color:#fff;text-decoration:underline}

/* onboarding */
#guide{position:fixed;inset:0;z-index:40;background:var(--scrim);display:grid;place-items:end center;padding:16px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 16px)}
#guide .card{background:var(--surface);border-radius:var(--r-l);padding:20px;max-width:440px;width:100%}
#guide h3{font-family:var(--font-c);font-size:28px;margin:0 0 6px;line-height:1.1}
#guide p{margin:0 0 16px;color:var(--ink2)}
#guide .dots{display:flex;gap:6px;margin-bottom:14px}
#guide .dots i{width:24px;height:4px;border-radius:2px;background:var(--line)}
#guide .dots i.on{background:var(--ink)}
.simtag{position:absolute;left:50%;transform:translateX(-50%);top:8px;z-index:2;background:var(--fair);color:#fff;font-weight:700;font-size:12px;padding:3px 10px;border-radius:999px}
#adv:not([hidden]) ~ .simtag{top:auto;bottom:calc(var(--dockH,200px) + 70px)}
</style>
</head>
<body>

<header id="status">
  <button id="gchip" data-q="none" aria-label="Estado do GNSS">
    <span id="gdot"></span>
    <span style="min-width:0;display:flex;flex-direction:column;align-items:flex-start">
      <span id="gacc" class="num">—</span>
      <span id="glabel">Iniciando GNSS…</span>
    </span>
    <span id="gbars" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
  </button>
  <button class="sbtn" id="uiToggle" aria-label="Alternar visão simples ou avançada">Simples</button>
  <button class="sbtn" id="syncDot" data-s="local" aria-label="Sincronização">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M7 18a5 5 0 1 1 .9-9.9A6 6 0 0 1 19 10a4 4 0 0 1-1 7.9"/><path d="M12 12v8m-3-3 3 3 3-3"/></svg>
  </button>
</header>

<main>
  <section class="view" id="v-map" role="tabpanel">
    <canvas id="map" aria-label="Mapa do levantamento"></canvas>
    <svg id="cross" viewBox="0 0 44 44" hidden><circle cx="22" cy="22" r="9" fill="none" stroke="var(--poor)" stroke-width="2"/><path d="M22 0v14M22 30v14M0 22h14M30 22h14" stroke="var(--poor)" stroke-width="2"/></svg>
    <div id="adv" hidden></div>
    <div class="simtag" id="simtag" hidden>GNSS simulado</div>
    <div id="stk" hidden></div>
    <svg id="north" viewBox="0 0 28 28" aria-hidden="true"><path d="M14 2 21 22 14 18 7 22Z" fill="var(--ink)"/><text x="14" y="15" text-anchor="middle" font-size="7" font-weight="700" fill="var(--surface)" font-family="Barlow">N</text></svg>
    <div id="scale" class="num"><span id="scaleTxt"></span><i id="scaleBar"></i></div>
    <div id="mapbtns">
      <button class="mbtn" id="bFollow" aria-pressed="true" aria-label="Centralizar na posição"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
      <button class="mbtn" id="bFit" aria-label="Ver todas as feições"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg></button>
      <button class="mbtn" id="bMeasure" aria-pressed="false" aria-label="Medir no mapa"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 17 17 3l4 4L7 21z"/><path d="m7 13 2 2m1-5 2 2m1-5 2 2"/></svg></button>
      <button class="mbtn" id="bLayers" aria-label="Camadas visíveis"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="m12 3 9 5-9 5-9-5z"/><path d="m3 13 9 5 9-5"/></svg></button>
    </div>
    <div id="dock">
      <div id="drawBar" class="bar" hidden></div>
      <div id="measureBar" class="bar" hidden></div>
      <div class="seg" id="geomSeg" role="group" aria-label="Tipo de feição">
        <button data-g="pt" aria-pressed="true"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="5"/></svg><span data-i18n>Ponto</span></button>
        <button data-g="ln" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 18 10 8l5 6 5-9"/></svg><span data-i18n>Linha</span></button>
        <button data-g="pg" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"><path d="M4 7 13 4l7 7-4 9-11-3z"/></svg><span data-i18n>Polígono</span></button>
      </div>
      <div id="dockRow">
        <button id="layerChip" aria-label="Camada ativa"><span class="sw"></span><span style="min-width:0"><small data-i18n>Camada</small><strong id="layerName">—</strong></span></button>
        <button id="collect"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span id="collectTxt">Coletar</span><span class="prog" id="collectProg"></span></button>
      </div>
    </div>
  </section>

/* ============================================================
   Geodésia: UTM (Krüger/Snyder) — funciona sem bibliotecas
   ============================================================ */
const ELL={a:6378137,f:1/298.257222101}; // GRS80 (SIRGAS 2000) ≈ WGS 84 ao mm
const e2=ELL.f*(2-ELL.f), ep2=e2/(1-e2), k0=0.9996;
const zoneOf=lon=>clamp(Math.floor((lon+180)/6)+1,1,60);
const cm=z=>(z-1)*6-180+3;
function ll2utm(lat,lon,zone,south){
  const a=ELL.a,phi=lat*D2R,l0=cm(zone)*D2R,lam=lon*D2R;
  const sn=Math.sin(phi),cs=Math.cos(phi),tn=Math.tan(phi);
  const N=a/Math.sqrt(1-e2*sn*sn),T=tn*tn,C=ep2*cs*cs,A=cs*(lam-l0);
  const e4=e2*e2,e6=e4*e2;
  const M=a*((1-e2/4-3*e4/64-5*e6/256)*phi-(3*e2/8+3*e4/32+45*e6/1024)*Math.sin(2*phi)+(15*e4/256+45*e6/1024)*Math.sin(4*phi)-(35*e6/3072)*Math.sin(6*phi));
  const x=k0*N*(A+(1-T+C)*A**3/6+(5-18*T+T*T+72*C-58*ep2)*A**5/120)+500000;
  let y=k0*(M+N*tn*(A*A/2+(5-T+9*C+4*C*C)*A**4/24+(61-58*T+T*T+600*C-330*ep2)*A**6/720));
  if(south)y+=10000000;
  return [x,y];
}
function utm2ll(x,y,zone,south){
  const a=ELL.a,e4=e2*e2,e6=e4*e2;
  const M=(y-(south?10000000:0))/k0;
  const mu=M/(a*(1-e2/4-3*e4/64-5*e6/256));
  const e1=(1-Math.sqrt(1-e2))/(1+Math.sqrt(1-e2));
  const p1=mu+(3*e1/2-27*e1**3/32)*Math.sin(2*mu)+(21*e1*e1/16-55*e1**4/32)*Math.sin(4*mu)+(151*e1**3/96)*Math.sin(6*mu)+(1097*e1**4/512)*Math.sin(8*mu);
  const sn=Math.sin(p1),cs=Math.cos(p1),tn=Math.tan(p1);
  const C1=ep2*cs*cs,T1=tn*tn,N1=a/Math.sqrt(1-e2*sn*sn),R1=a*(1-e2)/Math.pow(1-e2*sn*sn,1.5),D=(x-500000)/(N1*k0);
  const lat=p1-(N1*tn/R1)*(D*D/2-(5+3*T1+10*C1-4*C1*C1-9*ep2)*D**4/24+(61+90*T1+298*C1+45*T1*T1-252*ep2-3*C1*C1)*D**6/720);
  const lon=cm(zone)*D2R+(D-(1+2*T1+C1)*D**3/6+(5-2*C1+28*T1-3*C1*C1+8*ep2+24*T1*T1)*D**5/120)/cs;
  return [lat*R2D,lon*R2D];
}
const kFactor=E=>k0*(1+((E-500000)**2)/(2*6381000**2));
const convergence=(lat,lon,zone)=>(lon-cm(zone))*Math.sin(lat*D2R); // graus, aprox.

/* EPSG ------------------------------------------------------- */
function sirgasCode(z,south){ if(south&&z>=17&&z<=25)return 31960+z; if(!south&&z>=11&&z<=22)return 31954+z; return null; }
function wgsCode(z,south){return (south?32700:32600)+z;}
function projCode(){const z=P.zone,s=P.south;return S.datum==='sirgas'?(sirgasCode(z,s)||wgsCode(z,s)):wgsCode(z,s);}
const CRS_LIST=[]; // [code,label]
(function buildCRS(){
  CRS_LIST.push([4326,'WGS 84 — geográficas (lat/lon)'],[4674,'SIRGAS 2000 — geográficas'],[3857,'Web Mercator (pseudo)'],[5880,'SIRGAS 2000 / Policônica Brasil']);
  for(let z=17;z<=25;z++)CRS_LIST.push([31960+z,`SIRGAS 2000 / UTM ${z}S`]);
  for(let z=18;z<=22;z++)CRS_LIST.push([31954+z,`SIRGAS 2000 / UTM ${z}N`]);
  for(let z=17;z<=25;z++)CRS_LIST.push([32700+z,`WGS 84 / UTM ${z}S`]);
  for(let z=18;z<=22;z++)CRS_LIST.push([32600+z,`WGS 84 / UTM ${z}N`]);
  for(let z=18;z<=25;z++)CRS_LIST.push([29170+z,`SAD69 / UTM ${z}S`]);
  for(let z=21;z<=25;z++)CRS_LIST.push([22500+z,`Córrego Alegre 1970-72 / UTM ${z}S`]);
})();
function proj4Def(code){
  code=Number(code);
  if(code===4326)return '+proj=longlat +datum=WGS84 +no_defs';
  if(code===4674)return '+proj=longlat +ellps=GRS80 +towgs84=0,0,0 +no_defs';
  if(code===3857)return '+proj=merc +a=6378137 +b=6378137 +lat_ts=0 +lon_0=0 +x_0=0 +y_0=0 +k=1 +units=m +nadgrids=@null +no_defs';
  if(code===5880)return '+proj=poly +lat_0=0 +lon_0=-54 +x_0=5000000 +y_0=10000000 +ellps=GRS80 +towgs84=0,0,0 +units=m +no_defs';
  if(code>=31977&&code<=31985)return `+proj=utm +zone=${code-31960} +south +ellps=GRS80 +towgs84=0,0,0 +units=m +no_defs`;
  if(code>=31965&&code<=31976)return `+proj=utm +zone=${code-31954} +ellps=GRS80 +towgs84=0,0,0 +units=m +no_defs`;
  if(code>32700&&code<=32760)return `+proj=utm +zone=${code-32700} +south +datum=WGS84 +units=m +no_defs`;
  if(code>32600&&code<=32660)return `+proj=utm +zone=${code-32600} +datum=WGS84 +units=m +no_defs`;
  if(code>=29187&&code<=29195)return `+proj=utm +zone=${code-29170} +south +ellps=aust_SA +towgs84=-67.35,3.88,-38.22,0,0,0,0 +units=m +no_defs`;
  if(code>=22521&&code<=22525)return `+proj=utm +zone=${code-22500} +south +ellps=intl +towgs84=-205.57,168.77,-4.12,0,0,0,0 +units=m +no_defs`;
  const c=(S.customCRS||[]).find(x=>Number(x.code)===code); if(c)return c.def;
  return null;
}
const crsLabel=c=>{const f=CRS_LIST.find(x=>x[0]==c);if(f)return `EPSG:${c} — ${f[1]}`;const u=(S.customCRS||[]).find(x=>x.code==c);return u?`EPSG:${c} — ${u.name||'personalizado'}`:`EPSG:${c}`;};
const isGeo=c=>[4326,4674].includes(Number(c))||/longlat/.test(proj4Def(c)||'');
/* converte (x,y) num EPSG para [lon,lat] WGS84, e vice-versa */
function toWGS(x,y,code){
  code=Number(code);
  if(code===4326||code===4674)return [x,y];
  let m=null;
  if(code>=31977&&code<=31985)m=[code-31960,true]; else if(code>=31965&&code<=31976)m=[code-31954,false];
  else if(code>32700&&code<=32760)m=[code-32700,true]; else if(code>32600&&code<=32660)m=[code-32600,false];
  if(m){const [la,lo]=utm2ll(x,y,m[0],m[1]);return [lo,la];}
  const def=proj4Def(code); if(!def)throw new Error(`EPSG:${code} não está cadastrado. Adicione a definição em Ajustes › Sistemas personalizados.`);
  if(!window.proj4)throw new Error('A biblioteca de projeções não carregou (sem internet na primeira abertura). UTM e geográficas continuam funcionando.');
  return proj4(def,'WGS84',[x,y]);
}
function fromWGS(lon,lat,code){
  code=Number(code);
  if(code===4326||code===4674)return [lon,lat];
  let m=null;
  if(code>=31977&&code<=31985)m=[code-31960,true]; else if(code>=31965&&code<=31976)m=[code-31954,false];
  else if(code>32700&&code<=32760)m=[code-32700,true]; else if(code>32600&&code<=32660)m=[code-32600,false];
  if(m)return ll2utm(lat,lon,m[0],m[1]);
  const def=proj4Def(code); if(!def)throw new Error(`EPSG:${code} não está cadastrado.`);
  if(!window.proj4)throw new Error('A biblioteca de projeções não carregou. Conecte-se uma vez para habilitá-la.');
  return proj4('WGS84',def,[lon,lat]);
}

/* Ângulos ---------------------------------------------------- */
const normAz=a=>((a%360)+360)%360;
function dms(v,dec=1,hem){
  const s=v<0?-1:1;v=Math.abs(v);let d=Math.floor(v),m=Math.floor((v-d)*60),sec=((v-d)*60-m)*60;
  if(+sec.toFixed(dec)>=60){sec=0;m++;} if(m>=60){m=0;d++;}
  const str=`${d}°${String(m).padStart(2,'0')}′${fmt(sec,dec).padStart(dec?3+dec:2,'0')}″`;
  return hem?str+' '+(s<0?hem[1]:hem[0]):(s<0?'-':'')+str;
}
const fAz=a=>S.ang==='dms'?dms(normAz(a),0):fmt(normAz(a),4)+'°';
const fLat=v=>S.ang==='dms'?dms(v,3,['N','S']):fmt(v,8)+'°';
const fLon=v=>S.ang==='dms'?dms(v,3,['E','W']):fmt(v,8)+'°';
function parseAngle(s){
  if(s==null)return NaN; s=String(s).trim().toUpperCase(); if(!s)return NaN;
  const neg=/^-/.test(s)||/[SWO]$/.test(s.replace(/\s/g,''))&&!/^[NE]/.test(s);
  const nums=s.replace(/,/g,'.').match(/\d+(\.\d+)?/g); if(!nums)return NaN;
  const [d,m=0,sec=0]=nums.map(Number); const v=d+m/60+sec/3600;
  return neg?-v:v;
}
function rumo(az){az=normAz(az);const q=az<=90?['N','E',az]:az<=180?['S','E',180-az]:az<=270?['S',S.lang==='en'?'W':'O',az-180]:['N',S.lang==='en'?'W':'O',360-az];return `${q[0]} ${dms(q[2],0)} ${q[1]}`;}

/* ============================================================
   Estado, armazenamento (IndexedDB + fallback)
   ============================================================ */
const DEF_S={lang:'pt',ui:'simple',datum:'sirgas',ang:'dec',avgN:5,maxAcc:5,prefix:'P',csv:'br',theme:'auto',battery:false,wake:false,sim:false,estaca:20,tol:0.30,contDist:5,src:'gnss',customCRS:[],seenGuide:false};
function loadS(){try{return Object.assign({},DEF_S,JSON.parse(localStorage.getItem('marco.s')||'{}'));}catch(e){return {...DEF_S};}}
function saveS(){try{localStorage.setItem('marco.s',JSON.stringify(S));}catch(e){}}
S=loadS();

const IDB={db:null,
  open(){return new Promise(res=>{try{const r=indexedDB.open('marco',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>{this.db=r.result;res(true)};r.onerror=()=>res(false);}catch(e){res(false)}});},
  get(k){return new Promise(res=>{if(!this.db){try{res(JSON.parse(localStorage.getItem('marco.'+k)));}catch(e){res(null)}return;}try{const q=this.db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result??null);q.onerror=()=>res(null);}catch(e){res(null)}});},
  set(k,v){return new Promise(res=>{if(!this.db){try{localStorage.setItem('marco.'+k,JSON.stringify(v));res(true);}catch(e){res(false)}return;}try{const tx=this.db.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=()=>res(true);tx.onerror=()=>res(false);}catch(e){res(false)}});},
  del(k){return new Promise(res=>{if(!this.db){try{localStorage.removeItem('marco.'+k)}catch(e){}res(true);return;}try{const tx=this.db.transaction('kv','readwrite');tx.objectStore('kv').delete(k);tx.oncomplete=()=>res(true);}catch(e){res(false)}});}
};

};

/* coordenadas planas do projeto */
function ensureZone(lon,lat){if(P.zone==null){P.zone=zoneOf(lon);P.south=lat<0;clearXY();touch();}}
const toXY=(lon,lat)=>ll2utm(lat,lon,P.zone||23,P.south);
const fromXY=(E,N)=>{const [la,lo]=utm2ll(E,N,P.zone||23,P.south);return [lo,la];};
function fxy(f){if(!f._xy)f._xy=f.c.map(p=>toXY(p[0],p[1]));return f._xy;}

   GNSS
   ============================================================ */
const G={watch:null,last:null,status:'off',err:'',listeners:new Set(),simT:null,sim:null,history:[]};
function gStart(){
  gStop();
  if(S.sim){startSim();return;}
  if(!('geolocation' in navigator)){gErr('Este navegador não oferece localização. Ative o GNSS simulado em Ajustes para testar.');return;}
  G.status='wait';G.err='';updGNSS();
  try{G.watch=navigator.geolocation.watchPosition(onPos,onPosErr,{enableHighAccuracy:true,maximumAge:S.battery?3000:0,timeout:30000});}
  catch(e){gErr('Localização bloqueada nesta janela. Abra o app em tela cheia ou use o GNSS simulado para testar.');}
}
function gStop(){if(G.watch!=null){try{navigator.geolocation.clearWatch(G.watch)}catch(e){}}G.watch=null;clearInterval(G.simT);G.simT=null;}
function gErr(m){G.status='err';G.err=m;updGNSS();}
function onPos(p){const c=p.coords;feed({lat:c.latitude,lon:c.longitude,alt:c.altitude,acc:c.accuracy,altAcc:c.altitudeAccuracy,speed:c.speed,hdg:c.heading,t:p.timestamp||Date.now()});}
function onPosErr(e){
  if(e.code===1)gErr('Acesso à localização negado. Libere a localização para este site nas configurações do navegador e toque no indicador de sinal para tentar de novo.');
  else if(e.code===2)gErr('Posição indisponível. Verifique se a localização do aparelho está ligada e vá para céu aberto.');
  else{G.status=G.last?'ok':'wait';updGNSS();}
}
function feed(pos){
  G.last=pos;G.status='ok';G.err='';
  ensureZone(pos.lon,pos.lat);
  pos.xy=toXY(pos.lon,pos.lat);
  G.listeners.forEach(fn=>{try{fn(pos)}catch(e){console.error(e)}});
  onGNSSUpdate();
}
function startSim(){
  if(!G.sim){const c=P.features.length?fromXY(...centerOfData()):[-47.8825,-15.7942];G.sim={lon:c[0],lat:c[1],alt:1100,vE:0,vN:0};}
  G.status='wait';updGNSS();
  const tick=()=>{const s=G.sim;const mLat=1/111320,mLon=1/(111320*Math.cos(s.lat*D2R));
    s.lon+=(Math.random()-.5)*0.25*mLon;s.lat+=(Math.random()-.5)*0.25*mLat;
    const acc=0.6+Math.random()*1.4;feed({lat:s.lat,lon:s.lon,alt:s.alt+(Math.random()-.5)*0.3,acc,altAcc:acc*1.6,speed:0,hdg:null,t:Date.now(),sim:true});};
  tick();G.simT=setInterval(tick,S.battery?2000:1000);
}
function quality(acc){if(acc==null||G.status!=='ok')return ['none',t('Sem sinal'),0];if(acc<=1)return ['good',t('Precisão alta'),4];if(acc<=5)return ['good',t('Precisão boa'),3];if(acc<=15)return ['fair',t('Precisão regular'),2];return ['poor',t('Precisão fraca'),1];}
function updGNSS(){
  const chip=$('#gchip'),L=G.last,stale=L&&Date.now()-L.t>10000;
  let q=quality(L&&!stale?L.acc:null);
  if(G.status==='err'){chip.dataset.q='poor';$('#gacc').textContent='!';$('#glabel').textContent=G.err.split('.')[0];}
  else if(G.status==='wait'||!L){chip.dataset.q='none';$('#gacc').textContent='—';$('#glabel').textContent=t('Aguardando sinal…');}
  else{chip.dataset.q=q[0];$('#gacc').textContent='±'+fmt(L.acc,L.acc<10?1:0)+' m';$('#glabel').textContent=stale?'Sinal desatualizado':q[1];}
  $$('#gbars i').forEach((b,i)=>b.classList.toggle('on',i<q[2]));
  $('#gbars').style.color=`var(--${q[0]==='none'?'ink2':q[0]})`;
  $('#simtag').hidden=!S.sim;
  if(S.ui==='adv'&&P)renderAdv();
}
setInterval(updGNSS,5000);

const w2s=(x,y)=>[W/2+(x-V.cx)*V.s,H/2-(y-V.cy)*V.s];

  ctx.stroke();

    for(let x=Math.ceil(x0/step)*step;x<=x1;x+=step){const sx=w2s(x,0)[0];ctx.fillText('E '+Math.round(x).toLocaleString(LOC()),sx+3,H*0.5-2);}
    for(let y=Math.ceil(y0/step)*step;y<=y1;y+=step){const sy=w2s(0,y)[1];ctx.fillText('N '+Math.round(y).toLocaleString(LOC()),4,sy-2);}}

    if(f.g!==pass)continue;const L=lyr[f.l];if(!L||!L.vis)continue;const xy=fxy(f),sel=SEL===f.id,col=L.color;
    if(f.g==='pt'){const [sx,sy]=w2s(xy[0][0],xy[0][1]);if(sx<-20||sy<-20||sx>W+20||sy>H+20)continue;
      ctx.beginPath();ctx.arc(sx,sy,sel?8:5.5,0,7);ctx.fillStyle=col;ctx.fill();ctx.lineWidth=2;ctx.strokeStyle=COL.surface;ctx.stroke();
      if(sel){ctx.beginPath();ctx.arc(sx,sy,13,0,7);ctx.strokeStyle=col;ctx.stroke();}
      if(showLabels&&f.n){ctx.fillStyle=COL.ink;ctx.strokeStyle=COL.ground;ctx.lineWidth=3;ctx.strokeText(f.n,sx+9,sy-8);ctx.fillText(f.n,sx+9,sy-8);}
    }else{ctx.beginPath();xy.forEach((p,i)=>{const [sx,sy]=w2s(p[0],p[1]);i?ctx.lineTo(sx,sy):ctx.moveTo(sx,sy);});
      if(f.g==='pg'){ctx.closePath();ctx.fillStyle=col+'2E';ctx.fill();}
      ctx.lineJoin='round';ctx.lineWidth=sel?4.5:2.5;ctx.strokeStyle=col;ctx.stroke();
      if(sel){ctx.fillStyle=COL.surface;xy.forEach(p=>{const [sx,sy]=w2s(p[0],p[1]);ctx.beginPath();ctx.arc(sx,sy,4,0,7);ctx.fill();ctx.lineWidth=2;ctx.stroke();});}
      if(showLabels&&f.n&&xy.length){const c=f.g==='pg'?centroid(xy):xy[Math.floor(xy.length/2)];const [sx,sy]=w2s(c[0],c[1]);ctx.fillStyle=COL.ink;ctx.strokeStyle=COL.ground;ctx.lineWidth=3;ctx.strokeText(f.n,sx+6,sy);ctx.fillText(f.n,sx+6,sy);}
    }
  }
  // rascunho
  if(DR&&DR.xy.length){ctx.beginPath();DR.xy.forEach((p,i)=>{const [sx,sy]=w2s(p[0],p[1]);i?ctx.lineTo(sx,sy):ctx.moveTo(sx,sy);});
    const cur=currentXY();if(cur){const [sx,sy]=w2s(cur[0],cur[1]);ctx.setLineDash([6,5]);ctx.lineTo(sx,sy);if(DR.g==='pg'&&DR.xy.length>1){const [ax,ay]=w2s(DR.xy[0][0],DR.xy[0][1]);ctx.lineTo(ax,ay);}}
    ctx.strokeStyle=COL.poor;ctx.lineWidth=3;ctx.stroke();ctx.setLineDash([]);
    DR.xy.forEach(p=>{const [sx,sy]=w2s(p[0],p[1]);ctx.beginPath();ctx.arc(sx,sy,5,0,7);ctx.fillStyle=COL.poor;ctx.fill();});}
  // medição
  if(M.on&&M.pts.length){ctx.beginPath();M.pts.forEach((p,i)=>{const [sx,sy]=w2s(p[0],p[1]);i?ctx.lineTo(sx,sy):ctx.moveTo(sx,sy);});if(M.pts.length>2){ctx.closePath();ctx.fillStyle=COL.signal+'40';ctx.fill();}
    ctx.strokeStyle=COL.ink;ctx.lineWidth=2.5;ctx.setLineDash([8,4]);ctx.stroke();ctx.setLineDash([]);
    M.pts.forEach(p=>{const [sx,sy]=w2s(p[0],p[1]);ctx.beginPath();ctx.arc(sx,sy,5,0,7);ctx.fillStyle=COL.signal;ctx.fill();ctx.lineWidth=2;ctx.strokeStyle=COL.ink;ctx.stroke();});}
  // estaqueamento
  if(SO){const tg=SO.target;if(SO.line){ctx.beginPath();fxy(SO.line).forEach((p,i)=>{const [sx,sy]=w2s(p[0],p[1]);i?ctx.lineTo(sx,sy):ctx.moveTo(sx,sy);});ctx.strokeStyle=COL.ink;ctx.lineWidth=5;ctx.globalAlpha=.25;ctx.stroke();ctx.globalAlpha=1;}
    if(tg){const [tx,ty]=w2s(tg[0],tg[1]);const cur=G.last&&G.last.xy;if(cur){const [cx,cy]=w2s(cur[0],cur[1]);ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(tx,ty);ctx.setLineDash([4,4]);ctx.strokeStyle=COL.ink;ctx.lineWidth=2;ctx.stroke();ctx.setLineDash([]);}
      const tolPx=Math.max(SO.tol*V.s,6);ctx.beginPath();ctx.arc(tx,ty,tolPx,0,7);ctx.fillStyle=COL.good+'33';ctx.fill();

    if(r>8){ctx.beginPath();ctx.arc(sx,sy,r,0,7);ctx.fillStyle=COL.pos+'22';ctx.fill();ctx.strokeStyle=COL.pos+'88';ctx.lineWidth=1;ctx.stroke();}
    if(L.hdg!=null&&isFinite(L.hdg)&&L.speed>0.4){ctx.save();ctx.translate(sx,sy);ctx.rotate(L.hdg*D2R);ctx.beginPath();ctx.moveTo(0,-26);ctx.lineTo(9,-8);ctx.lineTo(-9,-8);ctx.closePath();ctx.fillStyle=COL.pos;ctx.fill();ctx.restore();}
    ctx.beginPath();ctx.arc(sx,sy,8,0,7);ctx.fillStyle=COL.pos;ctx.fill();ctx.lineWidth=3;ctx.strokeStyle='#fff';ctx.stroke();}

  const sm=niceStep(90/V.s);$('#scaleTxt').textContent=sm>=1000?fmt(sm/1000,sm%1000?1:0)+' km':fmt(sm,sm<1?1:0)+' m';$('#scaleBar').style.width=(sm*V.s)+'px';
}
function centroid(xy){let x=0,y=0;xy.forEach(p=>{x+=p[0];y+=p[1]});return [x/xy.length,y/xy.length];}
function centerOfData(){const b=bbox();return b?[(b[0]+b[2])/2,(b[1]+b[3])/2]:[500000,8250000];}
function bbox(list=P.features){let b=null;list.forEach(f=>{if(!(layerOf(f)||{}).vis)return;fxy(f).forEach(([x,y])=>{if(!b)b=[x,y,x,y];else{b[0]=Math.min(b[0],x);b[1]=Math.min(b[1],y);b[2]=Math.max(b[2],x);b[3]=Math.max(b[3],y);}});});return b;}
function fitTo(b,pad=60){if(!b)return;const w=Math.max(b[2]-b[0],10),h=Math.max(b[3]-b[1],10);V.cx=(b[0]+b[2])/2;V.cy=(b[1]+b[3])/2;const dh=dockH();V.s=clamp(Math.min((W-pad*2)/w,(H-dh-pad*2)/h),0.0005,400);V.cy-=(dh/2)/V.s;setFollow(false);dirty();}

/* gestos */
const PT=new Map();let gest=null,lpT=null;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);PT.set(e.pointerId,{x:e.offsetX,y:e.offsetY});
  if(PT.size===1){gest={t:Date.now(),x:e.offsetX,y:e.offsetY,cx:V.cx,cy:V.cy,moved:false};clearTimeout(lpT);lpT=setTimeout(()=>{if(gest&&!gest.moved){gest.long=true;longPress(gest.x,gest.y);}},600);}
  else if(PT.size===2){clearTimeout(lpT);const [a,b]=[...PT.values()];gest={pinch:true,d:Math.hypot(a.x-b.x,a.y-b.y),s:V.s,m:s2w((a.x+b.x)/2,(a.y+b.y)/2),moved:true};}

cv.addEventListener('pointermove',e=>{if(!PT.has(e.pointerId)||!gest)return;PT.set(e.pointerId,{x:e.offsetX,y:e.offsetY});
  if(gest.pinch&&PT.size===2){const [a,b]=[...PT.values()];const d=Math.hypot(a.x-b.x,a.y-b.y),mx=(a.x+b.x)/2,my=(a.y+b.y)/2;V.s=clamp(gest.s*d/gest.d,0.0005,400);V.cx=gest.m[0]-(mx-W/2)/V.s;V.cy=gest.m[1]+(my-H/2)/V.s;setFollow(false);dirty();}
  else if(!gest.pinch){const dx=e.offsetX-gest.x,dy=e.offsetY-gest.y;if(Math.hypot(dx,dy)>8)gest.moved=true;if(gest.moved){V.cx=gest.cx-dx/V.s;V.cy=gest.cy+dy/V.s;setFollow(false);dirty();}}
});
let lastTap=0;
function endPtr(e){if(!PT.has(e.pointerId))return;PT.delete(e.pointerId);clearTimeout(lpT);
  if(gest&&!gest.pinch&&!gest.moved&&!gest.long&&PT.size===0){const now=Date.now();if(now-lastTap<300){zoomAt(e.offsetX,e.offsetY,2);lastTap=0;}else{lastTap=now;tapAt(e.offsetX,e.offsetY);}}

function zoomAt(px,py,k){const w=s2w(px,py);V.s=clamp(V.s*k,0.0005,400);V.cx=w[0]-(px-W/2)/V.s;V.cy=w[1]+(py-H/2)/V.s;setFollow(false);dirty();}
function hitTest(px,py){
  let best=null,bd=1e9;
  for(const f of P.features){const L=layerOf(f);if(!L||!L.vis)continue;const xy=fxy(f).map(p=>w2s(p[0],p[1]));
    if(f.g==='pt'){const d=Math.hypot(xy[0][0]-px,xy[0][1]-py);if(d<20&&d<bd){bd=d;best=f;}}
    else{for(let i=1;i<xy.length+(f.g==='pg'?1:0);i++){const a=xy[i-1],b=xy[i%xy.length];const d=segDist([px,py],a,b);if(d<14&&d+4<bd){bd=d+4;best=f;}}

function segDist(p,a,b){const dx=b[0]-a[0],dy=b[1]-a[1],l=dx*dx+dy*dy;let t=l?((p[0]-a[0])*dx+(p[1]-a[1])*dy)/l:0;t=clamp(t,0,1);return Math.hypot(p[0]-a[0]-t*dx,p[1]-a[1]-t*dy);}

function longPress(px,py){

function fixReady(){
  if(usingCross())return true;
  if(G.status==='err'){toast(G.err,{err:true,action:'Tentar de novo',fn:gStart});return false;}
  if(!G.last||Date.now()-G.last.t>15000){toast('Ainda sem posição GNSS. Vá para céu aberto e aguarde o indicador ficar verde.',{err:true});return false;}
  return true;
}
function waitSamples(n){
  return new Promise((res,rej)=>{
    if(n<=1&&G.last&&Date.now()-G.last.t<2500){res([G.last]);return;}
    const arr=[];const fn=p=>{arr.push(p);prog(arr.length/n);if(arr.length>=n){done();res(arr);}};
    const done=()=>{G.listeners.delete(fn);clearTimeout(to);};
    const to=setTimeout(()=>{done();arr.length?res(arr):rej(new Error('Sem leituras GNSS no tempo esperado. Verifique o sinal.'));},Math.max(20000,n*4000));
    G.listeners.add(fn);
  });
}
function prog(v){$('#collectProg').style.width=(clamp(v,0,1)*100)+'%';}
async function acquire(){
  if(usingCross()){const w=s2w(W/2,H/2),ll=fromXY(w[0],w[1]);return {lon:ll[0],lat:ll[1],alt:null,acc:null,n:0,sd:null,src:'dig'};}
  busy=true;$('#collect').disabled=true;$('#collectTxt').textContent=S.avgN>1?'Média…':'…';
  try{
    const arr=await waitSamples(S.avgN);
    const n=arr.length,lat=arr.reduce((s,p)=>s+p.lat,0)/n,lon=arr.reduce((s,p)=>s+p.lon,0)/n;
    const alts=arr.filter(p=>p.alt!=null);const alt=alts.length?alts.reduce((s,p)=>s+p.alt,0)/alts.length:null;
    const acc=arr.reduce((s,p)=>s+p.acc,0)/n;const c=toXY(lon,lat);
    const sd=n>1?Math.sqrt(arr.reduce((s,p)=>s+(p.xy[0]-c[0])**2+(p.xy[1]-c[1])**2,0)/(n-1)):null;
    const r={lon,lat,alt,acc,n,sd,src:G.last.sim?'sim':'gnss',altAcc:arr.at(-1).altAcc};
    if(acc>S.maxAcc){const ok=await ask('Precisão acima do limite',`A precisão média foi ±${fmt(acc,1)} m, acima do limite de ${fmt(S.maxAcc,1)} m definido em Ajustes.`,[['Tentar de novo','retry'],['Salvar assim','ok','primary']]);if(ok==='retry'){busy=false;return acquire();}if(ok!=='ok')return null;}
    return r;
  }catch(e){toast(e.message,{err:true});return null;}
  finally{busy=false;$('#collect').disabled=false;prog(0);updDock();}
}
async function collectPoint(){if(!fixReady())return;const r=await acquire();if(!r)return;savePointAt(r.lon,r.lat,r.alt,r);}
function nextName(g){P.seq++;return ({pt:S.prefix||'P',ln:'L',pg:'A'})[g]+P.seq;}
function savePointAt(lon,lat,alt,meta={}){
  ensureZone(lon,lat);
  const l=activeLayer('pt');const f={id:uid(),l:l.id,g:'pt',n:nextName('pt'),c:[[r8(lon),r8(lat),r3(alt)]],a:{},m:{acc:r3(meta.acc),n:meta.n||0,sd:r3(meta.sd),src:meta.src||'gnss',t:Date.now()}};
  P.features.push(f);touch();dirty();if(navigator.vibrate)navigator.vibrate(30);
  const msg=`${t('Ponto salvo')}: ${f.n}`+(meta.acc!=null?` · ±${fmt(meta.acc,2)} m`:'');
  toast(msg,{action:t('Desfazer'),fn:()=>{removeFeature(f.id,true);}});
  if(l.fields&&l.fields.length)editAttrs(f,true);
  return f;
}
async function addVertex(){
  if(!fixReady())return;
  const r=await acquire();if(!r)return;
  ensureZone(r.lon,r.lat);
  if(!DR)DR={g:GEOM,l:activeLayer().id,c:[],xy:[],accs:[],cont:false};
  DR.c.push([r8(r.lon),r8(r.lat),r3(r.alt)]);DR.xy.push(toXY(r.lon,r.lat));if(r.acc!=null)DR.accs.push(r.acc);
  if(navigator.vibrate)navigator.vibrate(20);updDock();dirty();
}
function contTick(){const L=G.last;if(!L||L.acc>S.maxAcc)return;const last=DR.xy.at(-1);if(last&&Math.hypot(L.xy[0]-last[0],L.xy[1]-last[1])<S.contDist)return;
  DR.c.push([r8(L.lon),r8(L.lat),r3(L.alt)]);DR.xy.push(L.xy);DR.accs.push(L.acc);renderDrawBar();}
function renderDrawBar(){
  const b=$('#drawBar');if(!DR){b.hidden=true;return;}b.hidden=false;
  const len=lengthXY(DR.xy,DR.g==='pg'),ar=DR.g==='pg'&&DR.xy.length>2?areaXY(DR.xy):null;
  b.innerHTML=`<div class="info"><span>${DR.xy.length} vértices</span><span>${DR.g==='pg'?t('Perímetro'):t('Comprimento')} <b>${fDist(len)}</b></span>${ar!=null?`<span>${t('Área')} <b>${fArea(ar)}</b></span>`:''}</div>
   <button class="btn" id="dUndo" ${DR.xy.length?'':'disabled'}>${t('Desfazer')}</button>
   ${S.ui==='adv'?`<button class="btn" id="dCont" aria-pressed="${DR.cont}">${t('Contínuo')} ${fmt(S.contDist,0)} m</button>`:''}
   <button class="btn danger" id="dCancel">${t('Cancelar')}</button><button class="btn primary grow" id="dDone">${t('Finalizar')}</button>`;
  $('#dUndo').onclick=()=>{DR.c.pop();DR.xy.pop();renderDrawBar();dirty();};
  $('#dCancel').onclick=async()=>{if(DR.xy.length>1&&await ask('Descartar feição?',`Os ${DR.xy.length} vértices coletados serão perdidos.`,[[t('Cancelar'),'no'],['Descartar','yes','primary']])!=='yes')return;DR=null;updDock();dirty();};
  $('#dDone').onclick=finishDraft;
  const c=$('#dCont');if(c)c.onclick=()=>{DR.cont=!DR.cont;renderDrawBar();};
}
function finishDraft(){
  const need=DR.g==='pg'?3:2;if(DR.xy.length<need){toast(`Colete pelo menos ${need} vértices para ${DR.g==='pg'?'um polígono':'uma linha'}.`,{err:true});return;}
  const accs=DR.accs;const f={id:uid(),l:DR.l,g:DR.g,n:nextName(DR.g),c:DR.c,a:{},m:{acc:accs.length?r3(Math.max(...accs)):null,src:usingCross()?'dig':(G.last&&G.last.sim?'sim':'gnss'),t:Date.now()}};
  P.features.push(f);DR=null;touch();updDock();dirty();
  const xy=fxy(f);const msg=f.g==='pg'?`${t('Polígono salvo')}: ${fArea(areaXY(xy))}`:`${t('Linha salva')}: ${fDist(lengthXY(xy))}`;
  toast(msg,{action:t('Desfazer'),fn:()=>removeFeature(f.id,true)});
  const l=layerOf(f);if(l&&l.fields&&l.fields.length)editAttrs(f,true);
}
function removeFeature(id,silent){const i=P.features.findIndex(f=>f.id===id);if(i<0)return;const [f]=P.features.splice(i,1);if(SEL===id)SEL=null;touch();dirty();renderData();
  if(!silent)toast(`${t('Excluído')}: ${f.n}`,{action:t('Desfazer'),fn:()=>{P.features.splice(i,0,f);touch();dirty();renderData();}});}

/* atributos */
function attrForm(L,a){return (L.fields||[]).map(fd=>{const v=a[fd.k]??'';
  if(fd.type==='list')return `<div class="f" style="margin-bottom:12px"><span style="display:block;font-size:13px;font-weight:600;color:var(--ink2);margin:0 0 6px 2px">${esc(fd.label)}</span><div class="chips" data-k="${esc(fd.k)}">${fd.opts.map(o=>`<button type="button" class="chip" aria-pressed="${v===o}" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div></div>`;
  return `<label class="f"><span>${esc(fd.label)}</span><input class="i" data-k="${esc(fd.k)}" ${fd.type==='number'?'inputmode="decimal"':''} value="${esc(v)}"></label>`;}).join('');}
function bindAttrForm(b){$$('.chips',b).forEach(c=>c.addEventListener('click',e=>{const x=e.target.closest('.chip');if(!x)return;const on=x.getAttribute('aria-pressed')!=='true';$$('.chip',c).forEach(y=>y.setAttribute('aria-pressed','false'));x.setAttribute('aria-pressed',on);}));}
function readAttrForm(b,L){const a={};(L.fields||[]).forEach(fd=>{if(fd.type==='list'){const x=$(`.chips[data-k="${CSS.escape(fd.k)}"] .chip[aria-pressed="true"]`,b);if(x)a[fd.k]=x.dataset.v;}else{const i=$(`input[data-k="${CSS.escape(fd.k)}"]`,b);if(i&&i.value!=='')a[fd.k]=fd.type==='number'?pnum(i.value):i.value;}});return a;}
function editAttrs(f,quick){
  const L=layerOf(f);
  openSheet(`${t('Atributos')} · ${f.n}`,`<label class="f"><span>${t('Nome')}</span><input class="i" id="aName" value="${esc(f.n)}"></label>${attrForm(L,f.a)}
   <div class="actions"><button class="btn grow" id="aSkip">${quick?t('Pular'):t('Cancelar')}</button><button class="btn primary grow" id="aSave">${t('Salvar')}</button></div>`,b=>{
    bindAttrForm(b);
    $('#aSkip',b).onclick=closeSheet;
    $('#aSave',b).onclick=()=>{f.n=$('#aName',b).value.trim()||f.n;f.a=readAttrForm(b,L);touch();dirty();closeSheet();renderData();};
  });
}

/* detalhes da feição */
function openFeature(f){

  if(f.g==='pt'){const c=f.c[0];rows=`<dt>E</dt><dd>${fmt(xy[0][0],3)}</dd><dt>N</dt><dd>${fmt(xy[0][1],3)}</dd><dt>Alt. elip.</dt><dd>${c[2]!=null?fmt(c[2],3)+' m':'—'}</dd><dt>Lat</dt><dd>${fLat(c[1])}</dd><dt>Lon</dt><dd>${fLon(c[0])}</dd>`;}
  else{rows=`<dt>${f.g==='pg'?t('Perímetro'):t('Comprimento')}</dt><dd>${fDist(lengthXY(xy,f.g==='pg'))}</dd>`+(f.g==='pg'?`<dt>${t('Área')}</dt><dd>${fArea(areaXY(xy))}</dd>`:'')+`<dt>Vértices</dt><dd>${xy.length}</dd>`;}
  const m=f.m||{};
  if(m.acc!=null)rows+=`<dt>Precisão</dt><dd>±${fmt(m.acc,2)} m</dd>`;
  if(S.ui==='adv'){if(m.n)rows+=`<dt>Leituras</dt><dd>${m.n}${m.sd!=null?` · σ ${fmt(m.sd,3)} m`:''}</dd>`;rows+=`<dt>Origem</dt><dd>${({gnss:'GNSS',sim:'Simulado',dig:'Digitalizado',imp:'Importado',cogo:'COGO',stk:'Implantação'})[m.src]||'—'}</dd>`;
    if(f.g!=='pt'){const kk=kFactor(centroid(xy)[0]);rows+=`<dt>Fator k (UTM)</dt><dd>${fmt(kk,6)}</dd><dt>${f.g==='pg'?'Área':'Comp.'} no terreno*</dt><dd>${f.g==='pg'?fArea(areaXY(xy)/(kk*kk)):fDist(lengthXY(xy)/kk)}</dd>`;}}
  const attrs=Object.entries(f.a||{}).map(([k,v])=>{const fd=(L.fields||[]).find(x=>x.k===k);return `<dt>${esc(fd?fd.label:k)}</dt><dd style="font-family:var(--font);font-weight:500;font-size:15px">${esc(v)}</dd>`;}).join('');
  openSheet(`${f.n}`,`<p class="note" style="margin-top:0"><span class="sw" style="display:inline-block;width:10px;height:10px;border-radius:3px;background:${L.color}"></span> ${esc(L.name)} · ${new Date((m.t)||Date.now()).toLocaleString(LOC())}</p>
   <div class="result"><dl>${rows}${attrs}</dl></div>${S.ui==='adv'&&f.g!=='pt'?'<p class="note">*Corrigida do fator de escala UTM (sem fator de elevação).</p>':''}
   <div class="actions"><button class="btn primary grow" id="fStk">${t('Estaquear')}</button><button class="btn grow" id="fAttr">${t('Atributos')}</button></div>
   <div class="actions" style="margin-top:8px"><button class="btn grow" id="fCopy">${t('Copiar coordenadas')}</button><button class="btn grow" id="fZoom">${t('Centralizar')}</button><button class="btn danger" id="fDel">${t('Excluir')}</button></div>`,b=>{
    $('#fStk',b).onclick=()=>{closeSheet();if(f.g==='pt')startStakePoint(xy[0],f.n,f);else startStakeAlign(f);};
    $('#fAttr',b).onclick=()=>editAttrs(f);
    $('#fCopy',b).onclick=()=>copyText(featureText(f));
    $('#fZoom',b).onclick=()=>{closeSheet();showMap();if(f.g==='pt'){V.s=Math.max(V.s,6);centerOn(...xy[0]);setFollow(false);}else fitTo(bbox([f]));};
    $('#fDel',b).onclick=()=>{closeSheet();removeFeature(f.id);};
  },()=>{SEL=null;dirty();});
}
function featureText(f){const xy=fxy(f);return `${f.n} (${layerOf(f).name}) — ${crsLabel(projCode())}\n`+xy.map((p,i)=>`${f.g==='pt'?'':`V${i+1}: `}E ${p[0].toFixed(3)}  N ${p[1].toFixed(3)}${f.c[i][2]!=null?'  h '+f.c[i][2].toFixed(3):''}  |  ${f.c[i][1].toFixed(8)}, ${f.c[i][0].toFixed(8)}`).join('\n');}
async function copyText(s){try{await navigator.clipboard.writeText(s);toast('Copiado');}catch(e){openSheet('Copiar',`<textarea class="i" readonly style="min-height:180px">${esc(s)}</textarea><p class="note">Selecione o texto e copie manualmente.</p>`);}}

$('#bMeasure').onclick=()=>toggleMeasure();
function toggleMeasure(on=!M.on){if(on&&DR){toast('Finalize ou cancele a feição em coleta antes de medir.',{err:true});return;}M.on=on;M.pts=[];$('#bMeasure').setAttribute('aria-pressed',on);if(on)setFollow(false);updMeasure();updDock();dirty();}
function updMeasure(){

   <button class="btn" id="mU" ${p.length?'':'disabled'}>${t('Desfazer')}</button><button class="btn" id="mC">${t('Limpar')}</button>${p.length>1?`<button class="btn" id="mS">${t('Salvar como feição')}</button>`:''}<button class="btn primary grow" id="mX">${t('Sair')}</button>`;

}

/* ============================================================
   Estaqueamento (stakeout)
   ============================================================ */
let SO=null,soArrived=false;
function startStakePoint(xy,name,f){SO={type:'pt',target:[xy[0],xy[1]],name,f,tol:S.tol};soArrived=false;showMap();setFollow(true);renderStake();dirty();}
function startStakeAlign(f,station=0,offset=0){SO={type:'al',line:f,name:f.n,station,offset,tol:S.tol,target:null};alignTarget();soArrived=false;showMap();setFollow(true);renderStake();dirty();}
function chainOf(xy,p){let best={d:1e18},acc=0;for(let i=1;i<xy.length;i++){const a=xy[i-1],b=xy[i],dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy);if(!L)continue;let tt=((p[0]-a[0])*dx+(p[1]-a[1])*dy)/(L*L);const tc=clamp(tt,0,1);const qx=a[0]+tc*dx,qy=a[1]+tc*dy,d=Math.hypot(p[0]-qx,p[1]-qy);
  if(d<best.d){const cross=dx*(p[1]-a[1])-dy*(p[0]-a[0]);best={d,st:acc+tc*L,off:-cross/L,seg:i};}acc+=L;}return best;}
function pointAt(xy,st,off){let acc=0;for(let i=1;i<xy.length;i++){const a=xy[i-1],b=xy[i],dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy);if(acc+L>=st||i===xy.length-1){const tt=L?(st-acc)/L:0;return [a[0]+tt*dx+off*dy/L,a[1]+tt*dy-off*dx/L];}acc+=L;}return xy[0];}
const fEst=st=>{const n=Math.floor(st/S.estaca+1e-9),r=st-n*S.estaca;return `Est. ${n} + ${fmt(r,2)}`;};
function alignTarget(){SO.target=pointAt(fxy(SO.line),SO.station,SO.offset);}
function renderStake(){
  const el=$('#stk');if(!SO){el.hidden=true;$('#adv').style.visibility='';return;}el.hidden=false;$('#adv').style.visibility='hidden';
  el.innerHTML=`<div class="top"><canvas id="stkArrow" width="168" height="168"></canvas><div style="min-width:0;flex:1"><div id="stkName"></div><div id="stkDist" class="num">—</div><div id="stkDir"></div></div></div>
   ${SO.type==='al'?`<div class="row"><button class="btn" id="sPrev">− ${fmt(S.estaca,0)} m</button><button class="btn grow" id="sSet">${fEst(SO.station)}${SO.offset?` · ${fmt(Math.abs(SO.offset),2)} m ${SO.offset>0?'à dir.':'à esq.'}`:''}</button><button class="btn" id="sNext">+ ${fmt(S.estaca,0)} m</button></div>`:''}
   <div class="row"><button class="btn" id="sExit">${t('Sair')}</button>${SO.type==='pt'?'<button class="btn" id="sNextPt">Próximo ponto</button>':''}<button class="btn signal grow" id="sMark">${t('Marcar implantado')}</button></div>`;
  $('#sExit').onclick=()=>{SO=null;renderStake();dirty();};
  $('#sMark').onclick=markStaked;
  if(SO.type==='al'){$('#sPrev').onclick=()=>{SO.station=Math.max(0,SO.station-S.estaca);alignTarget();renderStake();dirty();};$('#sNext').onclick=()=>{SO.station=Math.min(lengthXY(fxy(SO.line)),SO.station+S.estaca);alignTarget();renderStake();dirty();};$('#sSet').onclick=()=>stakeAlignForm(SO.line);}
  else{$('#sNextPt').onclick=nextStakePoint;}
  updStake();
}
function nextStakePoint(){const pts=P.features.filter(f=>f.g==='pt'&&(!SO.f||f.l===SO.f.l));if(!pts.length)return;const i=SO.f?pts.indexOf(SO.f):-1;const nf=pts[(i+1)%pts.length];startStakePoint(fxy(nf)[0],nf.n,nf);}
function updStake(){
  if(!SO||$('#stk').hidden)return;const L=G.last,cur=L&&L.xy;const tg=SO.target;
  $('#stkName').textContent=`${t('Estaquear')}: ${SO.name}${SO.type==='al'?' · '+fEst(SO.station):''}`;
  const cvA=$('#stkArrow'),c=cvA.getContext('2d');c.setTransform(2,0,0,2,0,0);c.clearRect(0,0,84,84);
  if(!cur||!tg){$('#stkDist').textContent='—';$('#stkDir').textContent='Aguardando posição GNSS';return;}
  const dE=tg[0]-cur[0],dN=tg[1]-cur[1],d=Math.hypot(dE,dN),az=azXY(cur,tg);
  const ok=d<=SO.tol;$('#stk').classList.toggle('arrived',ok);
  if(ok&&!soArrived){if(navigator.vibrate)navigator.vibrate([60,40,60]);beep();toast(t('Chegou ao alvo'));}soArrived=ok;
  $('#stkDist').textContent=d<10?fmt(d,2)+' m':fmt(d,1)+' m';
  const ns=Math.abs(dN)>=0.005?`${fmt(Math.abs(dN),2)} m ${dN>0?'ao Norte':'ao Sul'}`:'',ew=Math.abs(dE)>=0.005?`${fmt(Math.abs(dE),2)} m ${dE>0?'a Leste':'a Oeste'}`:'';
  let line2=ok?'Dentro da tolerância de '+fmt(SO.tol,2)+' m':`Ande ${[ns,ew].filter(Boolean).join(' e ')}`;
  if(SO.type==='al'){const ch=chainOf(fxy(SO.line),cur);line2+=` · você: ${fEst(ch.st)}, ${fmt(Math.abs(ch.off),2)} m ${ch.off>0?'à direita':'à esquerda'}`;}
  if(S.ui==='adv')line2+=` · Az ${fAz(az)}`;
  $('#stkDir').textContent=line2;
  const heading=(L.hdg!=null&&isFinite(L.hdg)&&L.speed>0.5)?L.hdg:0; const rel=(az-heading)*D2R;
  c.save();c.translate(42,42);c.beginPath();c.arc(0,0,38,0,7);c.fillStyle=ok?COL.good:COL.ink;c.fill();
  if(ok){c.strokeStyle='#fff';c.lineWidth=5;c.lineCap='round';c.beginPath();c.moveTo(-14,0);c.lineTo(-4,10);c.lineTo(15,-10);c.stroke();}
  else{c.rotate(rel);c.fillStyle=COL.signal;c.beginPath();c.moveTo(0,-30);c.lineTo(16,6);c.lineTo(5,2);c.lineTo(5,24);c.lineTo(-5,24);c.lineTo(-5,2);c.lineTo(-16,6);c.closePath();c.fill();}
  c.restore();c.fillStyle=COL.surface;c.font='700 9px Barlow';c.textAlign='center';if(!heading&&!ok)c.fillText('N↑',42,80);
}
let actx=null;function beep(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=1320;g.gain.value=.08;o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+.18);}catch(e){}}
async function markStaked(){
  if(!fixReady())return;const r=await acquire();if(!r)return;const xy=toXY(r.lon,r.lat),tg=SO.target;
  let l=P.layers.find(x=>x.name==='Implantação'&&x.g==='pt');if(!l){l={id:uid(),name:'Implantação',g:'pt',color:'#B5487A',vis:true,fields:[]};P.layers.push(l);}
  const f={id:uid(),l:l.id,g:'pt',n:'S-'+SO.name+(SO.type==='al'?'-'+Math.round(SO.station):''),c:[[r8(r.lon),r8(r.lat),r3(r.alt)]],a:{alvo:SO.name,dE:r3(xy[0]-tg[0]),dN:r3(xy[1]-tg[1]),desvio:r3(Math.hypot(xy[0]-tg[0],xy[1]-tg[1])),...(SO.type==='al'?{estaca:fEst(SO.station),afast:r3(SO.offset)}:{})},m:{acc:r3(r.acc),n:r.n,sd:r3(r.sd),src:'stk',t:Date.now()}};
  P.features.push(f);touch();dirty();toast(`Implantado ${f.n} · desvio ${fmt(f.a.desvio,3)} m`);
  if(SO.type==='al'){SO.station=Math.min(lengthXY(fxy(SO.line)),SO.station+S.estaca);alignTarget();renderStake();}
}

function renderAdv(){

let sheetClose=null;
function openSheet(title,html,mount,onClose){
  if(sheetClose){const c=sheetClose;sheetClose=null;c();}
  $('#sheetTitle').textContent=title;const b=$('#sheetBody');b.innerHTML=html;b.scrollTop=0;
  $('#sheet').hidden=false;$('#scrim').hidden=false;sheetClose=onClose||null;mount&&mount(b);
  setTimeout(()=>{const f=$('#sheetBody input:not([readonly]),#sheetBody button');if(f&&window.matchMedia('(pointer:fine)').matches)f.focus();},50);
}
function closeSheet(){$('#sheet').hidden=true;$('#scrim').hidden=true;$('#sheetBody').innerHTML='';const c=sheetClose;sheetClose=null;c&&c();}

function ask(title,msg,btns){return new Promise(res=>{let done=false;openSheet(title,`<p style="margin:4px 0 16px">${esc(msg)}</p><div class="actions">${btns.map(([l,v,c])=>`<button class="btn grow ${c||''}" data-v="${v}">${esc(l)}</button>`).join('')}</div>`,b=>{$$('[data-v]',b).forEach(x=>x.onclick=()=>{done=true;closeSheet();res(x.dataset.v);});},()=>{if(!done)res(null);});});}
let toastT=null;
function toast(msg,o={}){const el=$('#toast');clearTimeout(toastT);el.className=o.err?'err':'';el.innerHTML=`<span>${esc(msg)}</span>${o.action?`<button>${esc(o.action)}</button>`:''}`;el.hidden=false;
  if(o.action)$('button',el).onclick=()=>{el.hidden=true;o.fn&&o.fn();};toastT=setTimeout(()=>el.hidden=true,o.err?7000:(o.action?6000:2800));}

      if(ty==='list'&&!opts.length){toast('Informe as opções da lista, separadas por vírgula.',{err:true});return;}keep();

/* seletor de ponto reutilizável */
function ptInput(id,label){const pts=P.features.filter(f=>f.g==='pt');return `<div class="f" style="margin-bottom:12px"><span style="display:block;font-size:13px;font-weight:600;color:var(--ink2);margin:0 0 4px 2px">${label}</span>
  <select class="i" id="${id}S" style="margin-bottom:6px"><option value="">Digitar E/N…</option><option value="__gps">${t('Usar posição atual')}</option>${pts.slice().reverse().slice(0,300).map(f=>`<option value="${f.id}">${esc(f.n)}</option>`).join('')}</select>
  <div class="row2"><input class="i" id="${id}E" inputmode="decimal" placeholder="E (m)"><input class="i" id="${id}N" inputmode="decimal" placeholder="N (m)"></div><input type="hidden" id="${id}Z"></div>`;}
function bindPt(b,id){$(`#${id}S`,b).onchange=e=>{const v=e.target.value;let xy=null,z='';if(v==='__gps'){if(!G.last){toast('Sem posição GNSS.',{err:true});e.target.value='';return;}xy=G.last.xy;z=G.last.alt??'';}else if(v){const f=P.features.find(x=>x.id===v);xy=fxy(f)[0];z=f.c[0][2]??'';}
  if(xy){$(`#${id}E`,b).value=xy[0].toFixed(3);$(`#${id}N`,b).value=xy[1].toFixed(3);$(`#${id}Z`,b).value=z;}};}
function readPt(b,id){const E=pnum($(`#${id}E`,b).value),N=pnum($(`#${id}N`,b).value);if(!isFinite(E)||!isFinite(N))return null;const z=pnum($(`#${id}Z`,b).value);return [E,N,isFinite(z)?z:null];}
function resBox(rows){return `<div class="result"><dl>${rows.map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl></div>`;}
function saveCogoPoint(xy,name,attrs={}){const ll=fromXY(xy[0],xy[1]);let l=P.layers.find(x=>x.name==='COGO'&&x.g==='pt');if(!l){l={id:uid(),name:'COGO',g:'pt',color:'#8E44AD',vis:true,fields:[]};P.layers.push(l);}
  const f={id:uid(),l:l.id,g:'pt',n:name||nextName('pt'),c:[[r8(ll[0]),r8(ll[1]),r3(xy[2]??null)]],a:attrs,m:{src:'cogo',t:Date.now()}};P.features.push(f);touch();dirty();toast(`Ponto ${f.n} salvo na camada COGO`);return f;}
function stakePointForm(){
  openSheet(t('Estaqueamento de ponto'),ptInput('a','Ponto a implantar')+`<label class="f"><span>Tolerância (m)</span><input class="i" id="tol" inputmode="decimal" value="${String(S.tol).replace('.',',')}"></label><button class="btn primary" style="width:100%" id="go">Iniciar navegação</button>`,b=>{
    bindPt(b,'a');$('#go',b).onclick=()=>{const p=readPt(b,'a');if(!p){toast('Escolha um ponto ou digite E e N.',{err:true});return;}const tl=pnum($('#tol',b).value);if(isFinite(tl)&&tl>0){S.tol=tl;saveS();}
      const sv=$('#aS',b).value;const f=sv&&sv!=='__gps'?P.features.find(x=>x.id===sv):null;closeSheet();startStakePoint(p,f?f.n:`E ${fmt(p[0],2)} N ${fmt(p[1],2)}`,f);};});
}
function stakeAlignForm(line){
  const lines=P.features.filter(f=>f.g==='ln'||f.g==='pg');
  if(!lines.length){toast('Colete ou importe uma linha primeiro para estaquear um alinhamento.',{err:true});return;}
  openSheet(t('Estaqueamento de alinhamento'),`<label class="f"><span>Alinhamento</span><select class="i" id="al">${lines.map(f=>`<option value="${f.id}" ${line&&line.id===f.id?'selected':''}>${esc(f.n)} · ${fDist(lengthXY(fxy(f)))}</option>`).join('')}</select></label>
   <div class="row2"><label class="f"><span>Intervalo de estacas (m)</span><input class="i" id="ei" inputmode="decimal" value="${S.estaca}"></label><label class="f"><span>Estaca inicial (m)</span><input class="i" id="st" inputmode="decimal" value="${SO&&SO.type==='al'?SO.station.toFixed(2):'0'}"></label></div>
   <label class="f"><span>Afastamento (m; + direita, − esquerda)</span><input class="i" id="of" inputmode="decimal" value="${SO&&SO.type==='al'?SO.offset:0}"></label>
   <p class="note">Padrão brasileiro: estacas de 20 m. A posição exibida é “Est. n + resto”.</p><button class="btn primary" style="width:100%" id="go">Iniciar</button>`,b=>{
    $('#go',b).onclick=()=>{const f=P.features.find(x=>x.id===$('#al',b).value);const ei=pnum($('#ei',b).value);if(isFinite(ei)&&ei>0){S.estaca=ei;saveS();}
      const st=pnum($('#st',b).value)||0,of=pnum($('#of',b).value)||0;closeSheet();startStakeAlign(f,clamp(st,0,lengthXY(fxy(f))),of);};});
}
function cogoInverse(){
  openSheet(t('Inverso (distância e azimute)'),ptInput('a','Ponto de partida (ré)')+ptInput('b','Ponto de chegada (vante)')+`<button class="btn primary" style="width:100%" id="go">${t('Calcular')}</button><div id="out"></div>`,b=>{
    bindPt(b,'a');bindPt(b,'b');$('#go',b).onclick=()=>{const A=readPt(b,'a'),B=readPt(b,'b');if(!A||!B){$('#out',b).innerHTML='<p class="err">Informe os dois pontos.</p>';return;}
      const d=Math.hypot(B[0]-A[0],B[1]-A[1]),az=azXY(A,B),rows=[['Distância horizontal',fmt(d,3)+' m'],['Azimute',fAz(az)],['Rumo',rumo(az)],['Contra-azimute',fAz(az+180)],['ΔE',fmt(B[0]-A[0],3)],['ΔN',fmt(B[1]-A[1],3)]];
      if(A[2]!=null&&B[2]!=null){const dh=B[2]-A[2];rows.push(['Desnível (Δh)',fmt(dh,3)+' m'],['Declividade',fmt(d?dh/d*100:0,2)+' %'],['Distância inclinada',fmt(Math.hypot(d,dh),3)+' m']);}
      const k=kFactor((A[0]+B[0])/2);rows.push(['Distância no terreno*',fmt(d/k,3)+' m']);
      $('#out',b).innerHTML=resBox(rows)+'<p class="note">*Dividida pelo fator de escala UTM médio. Desníveis GNSS usam altitude elipsoidal; para cotas ortométricas aplique o modelo geoidal (MAPGEO).</p>';};});
}
function cogoRadiation(){
  openSheet(t('Irradiação'),ptInput('a','Estação (ponto conhecido)')+`<div class="row2"><label class="f"><span>Azimute (graus ou GMS)</span><input class="i" id="az" placeholder="123°45'30&quot;"></label><label class="f"><span>Distância horizontal (m)</span><input class="i" id="d" inputmode="decimal"></label></div>
   <label class="f"><span>Nome do novo ponto (opcional)</span><input class="i" id="nm"></label><div class="actions"><button class="btn grow" id="go">${t('Calcular')}</button><button class="btn primary grow" id="sv" disabled>${t('Salvar')}</button></div><div id="out"></div>`,b=>{
    bindPt(b,'a');let res=null;
    $('#go',b).onclick=()=>{const A=readPt(b,'a'),az=parseAngle($('#az',b).value),d=pnum($('#d',b).value);if(!A||!isFinite(az)||!isFinite(d)){$('#out',b).innerHTML='<p class="err">Informe estação, azimute e distância.</p>';return;}
      res=[A[0]+d*Math.sin(az*D2R),A[1]+d*Math.cos(az*D2R)];$('#sv',b).disabled=false;$('#out',b).innerHTML=resBox([['E',fmt(res[0],3)],['N',fmt(res[1],3)],['Azimute usado',fAz(az)]]);};
    $('#sv',b).onclick=()=>{if(res)saveCogoPoint(res,$('#nm',b).value.trim(),{metodo:'irradiação'});};});
}
function cogoIntersection(){
  openSheet(t('Interseção de azimutes'),ptInput('a','Estação 1')+`<label class="f"><span>Azimute da estação 1</span><input class="i" id="z1"></label>`+ptInput('b','Estação 2')+`<label class="f"><span>Azimute da estação 2</span><input class="i" id="z2"></label>
   <div class="actions"><button class="btn grow" id="go">${t('Calcular')}</button><button class="btn primary grow" id="sv" disabled>${t('Salvar')}</button></div><div id="out"></div>`,b=>{
    bindPt(b,'a');bindPt(b,'b');let res=null;
    $('#go',b).onclick=()=>{const A=readPt(b,'a'),B=readPt(b,'b'),a1=parseAngle($('#z1',b).value),a2=parseAngle($('#z2',b).value);if(!A||!B||!isFinite(a1)||!isFinite(a2)){$('#out',b).innerHTML='<p class="err">Informe as duas estações e os dois azimutes.</p>';return;}
      const u=[Math.sin(a1*D2R),Math.cos(a1*D2R)],v=[Math.sin(a2*D2R),Math.cos(a2*D2R)],cr=u[0]*v[1]-u[1]*v[0];
      if(Math.abs(cr)<1e-9){$('#out',b).innerHTML='<p class="err">As visadas são paralelas e não se cruzam. Revise os azimutes.</p>';return;}
      const w=[B[0]-A[0],B[1]-A[1]],s=(w[0]*v[1]-w[1]*v[0])/cr;res=[A[0]+s*u[0],A[1]+s*u[1]];
      if(s<0){$('#out',b).innerHTML='<p class="err">O cruzamento fica atrás da estação 1. Confira o sentido dos azimutes.</p>';}
      else{$('#sv',b).disabled=false;$('#out',b).innerHTML=resBox([['E',fmt(res[0],3)],['N',fmt(res[1],3)],['Dist. da estação 1',fmt(s,3)+' m'],['Ângulo entre visadas',fmt(Math.abs(Math.asin(clamp(cr,-1,1))*R2D),2)+'°']]);}};
    $('#sv',b).onclick=()=>{if(res)saveCogoPoint(res,'',{metodo:'interseção'});};});
}
function cogoArea(){
  const pgs=P.features.filter(f=>f.g==='pg');
  openSheet(t('Área por coordenadas'),`${pgs.length?`<label class="f"><span>Preencher com polígono existente</span><select class="i" id="pg"><option value="">—</option>${pgs.map(f=>`<option value="${f.id}">${esc(f.n)}</option>`).join('')}</select></label>`:''}
   <label class="f"><span>Vértices: uma linha por vértice, “E N” (separados por espaço, tab ou ;)</span><textarea class="i" id="tx" placeholder="500000.000 8250000.000&#10;500120.500 8250010.250&#10;500100.000 8249900.000"></textarea></label>
   <div class="actions"><button class="btn grow" id="go">${t('Calcular')}</button><button class="btn primary grow" id="sv" disabled>Salvar como polígono</button></div><div id="out"></div>`,b=>{
    let pts=null;const pg=$('#pg',b);if(pg)pg.onchange=()=>{const f=P.features.find(x=>x.id===pg.value);if(f)$('#tx',b).value=fxy(f).map(p=>`${p[0].toFixed(3)} ${p[1].toFixed(3)}`).join('\n');};
    $('#go',b).onclick=()=>{pts=$('#tx',b).value.split(/\n/).map(l=>l.trim()).filter(Boolean).map(l=>l.split(/[\s;\t]+/).map(pnum)).filter(p=>p.length>=2&&isFinite(p[0])&&isFinite(p[1])).map(p=>[p[0],p[1]]);
      if(pts.length<3){$('#out',b).innerHTML='<p class="err">São necessários pelo menos 3 vértices válidos.</p>';$('#sv',b).disabled=true;return;}
      const a=areaXY(pts),per=lengthXY(pts,true),k=kFactor(centroid(pts)[0]);$('#sv',b).disabled=false;
      $('#out',b).innerHTML=resBox([['Área',fmt(a,2)+' m²'],['Área',fmt(a/10000,4)+' ha'],['Perímetro',fmt(per,3)+' m'],['Área no terreno*',fmt(a/(k*k),2)+' m²'],['Vértices',pts.length]])+'<p class="note">Método de Gauss (shoelace). *Corrigida do fator de escala UTM.</p>';};
    $('#sv',b).onclick=()=>{if(!pts)return;const l=activeLayer('pg');const f={id:uid(),l:l.id,g:'pg',n:nextName('pg'),c:pts.map(p=>{const ll=fromXY(p[0],p[1]);return [r8(ll[0]),r8(ll[1]),null];}),a:{},m:{src:'cogo',t:Date.now()}};P.features.push(f);touch();dirty();toast(`${t('Polígono salvo')}: ${f.n}`);};});
}
function crsSelect(id,sel){return `<select class="i" id="${id}">${[...CRS_LIST,...(S.customCRS||[]).map(c=>[c.code,c.name||'personalizado'])].map(([c,l])=>`<option value="${c}" ${c==sel?'selected':''}>EPSG:${c} — ${esc(l)}</option>`).join('')}</select>`;}
function convTool(){
  openSheet(t('Conversão de coordenadas'),`<label class="f"><span>Sistema de entrada</span>${crsSelect('ci',4326)}</label>
   <div class="row2"><label class="f"><span id="l1">Latitude</span><input class="i" id="v1" placeholder="-15.7942 ou 15°47'39&quot;S"></label><label class="f"><span id="l2">Longitude</span><input class="i" id="v2" placeholder="-47.8825"></label></div>
   <div class="actions" style="margin-bottom:12px"><button class="btn grow" id="gp">${t('Usar posição atual')}</button><button class="btn primary grow" id="go">Converter</button></div>
   <label class="f"><span>Também converter para</span>${crsSelect('co',projCode())}</label><div id="out"></div>`,b=>{
    const upd=()=>{const g=isGeo($('#ci',b).value);$('#l1',b).textContent=g?'Latitude':'E / X (m)';$('#l2',b).textContent=g?'Longitude':'N / Y (m)';};$('#ci',b).onchange=upd;upd();
    $('#gp',b).onclick=()=>{if(!G.last){toast('Sem posição GNSS.',{err:true});return;}$('#ci',b).value=4326;upd();$('#v1',b).value=G.last.lat.toFixed(8);$('#v2',b).value=G.last.lon.toFixed(8);};
    $('#go',b).onclick=()=>{try{const ci=+$('#ci',b).value,g=isGeo(ci);let a=g?parseAngle($('#v1',b).value):pnum($('#v1',b).value),c=g?parseAngle($('#v2',b).value):pnum($('#v2',b).value);
      if(!isFinite(a)||!isFinite(c))throw new Error('Preencha os dois valores. Use ponto ou vírgula como decimal.');
      const [lon,lat]=g?[c,a]:toWGS(a,c,ci);if(Math.abs(lat)>90||Math.abs(lon)>180)throw new Error('Coordenada fora do intervalo válido. Confira se lat/lon não estão invertidas.');
      const z=zoneOf(lon),south=lat<0,u=ll2utm(lat,lon,z,south),co=+$('#co',b).value,o=fromWGS(lon,lat,co);
      $('#out',b).innerHTML=resBox([['Latitude',dms(lat,4,['N','S'])],['',fmt(lat,8)+'°'],['Longitude',dms(lon,4,['E','W'])],['',fmt(lon,8)+'°'],[`UTM ${z}${south?'S':'N'} E`,fmt(u[0],3)],[`UTM ${z}${south?'S':'N'} N`,fmt(u[1],3)],['MC / fator k',`${cm(z)}° / ${fmt(kFactor(u[0]),6)}`],[`EPSG:${co} ${isGeo(co)?'Lon':'X'}`,fmt(o[0],isGeo(co)?8:3)],[`EPSG:${co} ${isGeo(co)?'Lat':'Y'}`,fmt(o[1],isGeo(co)?8:3)]])+
        `<button class="btn" style="width:100%" id="cp">${t('Copiar coordenadas')}</button>`;
      $('#cp',b).onclick=()=>copyText(`Lat ${lat.toFixed(8)}  Lon ${lon.toFixed(8)}\nUTM ${z}${south?'S':'N'}  E ${u[0].toFixed(3)}  N ${u[1].toFixed(3)}\nEPSG:${co}  ${o[0].toFixed(isGeo(co)?8:3)}  ${o[1].toFixed(isGeo(co)?8:3)}`);
    }catch(e){$('#out',b).innerHTML=`<p class="err">${esc(e.message)}</p>`;}};});
}
let LEV=null;
function levelTool(){
  LEV=LEV||{rn:100,rows:[{p:'RN',re:'',va:''},{p:'1',re:'',va:''}],km:'',known:''};
  const draw=b=>{
    let ai=null,cota=LEV.rn,sumRe=0,sumVa=0;const out=LEV.rows.map((r,i)=>{const re=pnum(r.re),va=pnum(r.va);let c='';
      if(i===0){cota=LEV.rn;c=cota;}else if(isFinite(va)&&ai!=null){cota=ai-va;c=cota;sumVa+=va;}
      if(isFinite(re)&&c!==''){ai=c+re;sumRe+=re;}return {ai:isFinite(re)&&c!==''?ai:null,c};});
    const last=out.at(-1).c,known=pnum(LEV.known),km=pnum(LEV.km);
    let fech='';if(last!==''&&isFinite(known)){const err=(last-known)*1000,tol=isFinite(km)?12*Math.sqrt(km):null;fech=resBox([['Cota calculada final',fmt(last,3)+' m'],['Erro de fechamento',fmt(err,1)+' mm'],...(tol?[['Tolerância 12√k',fmt(tol,1)+' mm'],['Situação',Math.abs(err)<=tol?'Dentro da tolerância':'Fora da tolerância — refaça o trecho']]:[])]);}
    b.innerHTML=`<div class="row2"><label class="f"><span>Cota da RN inicial (m)</span><input class="i" id="rn" inputmode="decimal" value="${LEV.rn}"></label><label class="f"><span>Cota conhecida no fechamento</span><input class="i" id="kn" inputmode="decimal" value="${esc(LEV.known)}" placeholder="opcional"></label></div>
     <div class="tbl"><table><thead><tr><th>Ponto</th><th>Ré</th><th>Vante</th><th>AI</th><th>Cota</th></tr></thead><tbody>${LEV.rows.map((r,i)=>`<tr><td><input data-i="${i}" data-k="p" value="${esc(r.p)}"></td><td><input data-i="${i}" data-k="re" inputmode="decimal" value="${esc(r.re)}"></td><td>${i?`<input data-i="${i}" data-k="va" inputmode="decimal" value="${esc(r.va)}">`:'—'}</td><td>${out[i].ai!=null?fmt(out[i].ai,3):''}</td><td><b>${out[i].c!==''?fmt(out[i].c,3):''}</b></td></tr>`).join('')}</tbody></table></div>
     <div class="actions" style="margin:10px 0"><button class="btn grow" id="add">+ Ponto</button><button class="btn" id="rm">Remover último</button><button class="btn danger" id="clr">${t('Limpar')}</button></div>
     <label class="f"><span>Extensão do nivelamento (km) para tolerância</span><input class="i" id="km" inputmode="decimal" value="${esc(LEV.km)}" placeholder="opcional"></label>
     ${resBox([['Σ Ré',fmt(sumRe,3)],['Σ Vante',fmt(sumVa,3)],['Σ Ré − Σ Vante',fmt(sumRe-sumVa,3)],['Cota final − RN',last!==''?fmt(last-LEV.rn,3):'—']])}${fech}
     <p class="note">AI = altura do instrumento (cota + ré); cota = AI − vante. A verificação Σré − Σvante deve igualar a diferença entre a última cota e a RN. Leituras em metros.</p>
     <button class="btn" style="width:100%" id="cp">Copiar caderneta</button>`;
    $$('input[data-i]',b).forEach(x=>x.onchange=()=>{LEV.rows[+x.dataset.i][x.dataset.k]=x.value;draw(b);});
    $('#rn',b).onchange=e=>{const v=pnum(e.target.value);if(isFinite(v))LEV.rn=v;draw(b);};$('#kn',b).onchange=e=>{LEV.known=e.target.value;draw(b);};$('#km',b).onchange=e=>{LEV.km=e.target.value;draw(b);};
    $('#add',b).onclick=()=>{LEV.rows.push({p:String(LEV.rows.length),re:'',va:''});draw(b);};$('#rm',b).onclick=()=>{if(LEV.rows.length>2)LEV.rows.pop();draw(b);};
    $('#clr',b).onclick=()=>{LEV=null;levelTool();};
    $('#cp',b).onclick=()=>copyText('Ponto;Ré;Vante;AI;Cota\n'+LEV.rows.map((r,i)=>[r.p,r.re,r.va,out[i].ai!=null?out[i].ai.toFixed(3):'',out[i].c!==''?out[i].c.toFixed(3):''].join(';')).join('\n'));
  };
  openSheet(t('Nivelamento geométrico'),'',draw);
}

   Importação

function pickFiles(){const fi=$('#fileIn');fi.value='';fi.onchange=()=>handleFiles([...fi.files]);fi.click();}
async function handleFiles(files){
  if(!files.length)return;
  const img=files.find(f=>/\.(png|jpe?g|webp)$/i.test(f.name)),wf=files.find(f=>/\.(pgw|jgw|tfw|wld|jpgw|pngw)$/i.test(f.name));
  if(img){await loadBackground(img,wf);return;}
  const groups={};files.forEach(f=>{const base=f.name.replace(/\.[^.]+$/,'').toLowerCase();(groups[base]=groups[base]||[]).push(f);});
  for(const [base,fs] of Object.entries(groups)){
    const shp=fs.find(f=>/\.shp$/i.test(f.name));
    if(shp){await importShapefileFiles(fs,base);continue;}
    for(const f of fs){if(/\.(dbf|prj|shx|cpg)$/i.test(f.name))continue;await importOne(f);}
  }
}
async function importOne(file){
  const name=file.name,ext=(name.split('.').pop()||'').toLowerCase();
  try{
    if(ext==='zip'){await importZip(file);return;}
    const txt=await file.text();
    if(ext==='kml')return finishImport(parseKML(txt),name,4326);
    if(ext==='gpx')return finishImport(parseGPX(txt),name,4326);
    if(ext==='geojson'||ext==='json')return finishImport(parseGeoJSON(JSON.parse(txt)),name,4326);
    if(ext==='dxf')return askCRS(name,projCode(),code=>finishImport(parseDXF(txt),name,code),'Arquivos DXF não guardam o sistema de coordenadas. Escolha em qual ele foi desenhado.');
    if(ext==='csv'||ext==='txt')return importCSV(txt,name);
    throw new Error(`Formato .${ext} não reconhecido. Use CSV, KML, GPX, GeoJSON, DXF ou Shapefile (.zip ou .shp + .dbf).`);
