/* ============================================================
   Sincronização (quando há conexão)
   ============================================================ */
const SY={db:null,uid:null,t:null,busy:false,last:null,err:''};
function markSync(s){syncState=s;$('#syncDot').dataset.s=s;}
function scheduleSync(){clearTimeout(SY.t);if(!SY.db)return;SY.t=setTimeout(syncNow,8000);}
async function initSync(){
  if(!window.claude||typeof window.claude.use!=='function'){markSync('local');return;}
  try{
    claude.use('downloads').then(d=>{DL=d;}).catch(()=>{});
    const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
    if(!db||!user){markSync('local');return;}
    const id=await user.id();if(!id){markSync('local');return;}
    SY.db=db;SY.uid=id;
    const meta=await db.doc(`data/users/${id}/meta`).get();
    if(meta.exists){const m=meta.data();SY.last=m.t;
      if(!P.features.length&&m.n){await restoreCloud(true);}
      else if(P.updated>(m.t||0))scheduleSync();else markSync('synced');}
    else if(P.features.length)scheduleSync();else markSync('synced');
  }catch(e){SY.err=e.message||String(e);markSync('error');}
}
async function syncNow(){
  if(!SY.db||SY.busy)return;if(!navigator.onLine){markSync('pending');return;}
  SY.busy=true;
  try{const json=JSON.stringify(P,(k,v)=>k.startsWith('_')?undefined:v);const CH=90000;const n=Math.ceil(json.length/CH);
    const metaRef=SY.db.doc(`data/users/${SY.uid}/meta`);const old=await metaRef.get();const oldN=old.exists?(old.data().n||0):0;
    for(let i=0;i<n;i++)await SY.db.doc(`data/users/${SY.uid}/c${i}`).set({s:json.slice(i*CH,(i+1)*CH)});
    await metaRef.set({n,t:P.updated,name:P.name,count:P.features.length});
    for(let i=n;i<oldN;i++){try{await SY.db.doc(`data/users/${SY.uid}/c${i}`).delete();}catch(e){}}
    SY.last=P.updated;SY.err='';markSync('synced');
  }catch(e){SY.err=e.message||String(e);markSync(e&&e.code==='resource_exhausted'?'pending':'error');if(e&&e.code==='resource_exhausted')scheduleSync();}
  finally{SY.busy=false;}
}
async function restoreCloud(silent){
  try{const m=(await SY.db.doc(`data/users/${SY.uid}/meta`).get()).data();let s='';for(let i=0;i<m.n;i++){const d=await SY.db.doc(`data/users/${SY.uid}/c${i}`).get();if(!d.exists)throw new Error('cópia na nuvem incompleta.');s+=d.data().s;}
    P=JSON.parse(s);P.active=P.active||{};await persist();markSync('synced');renderData();updDock();dirty();const b=bbox();if(b&&V.ready)fitTo(b);
    toast(silent?`Projeto “${P.name}” restaurado da nuvem`:'Projeto restaurado da nuvem');}
  catch(e){toast('Não foi possível restaurar: '+e.message,{err:true});}
}
function openSync(){
  const st={local:t('Somente neste aparelho'),pending:t('Pendente'),synced:t('Sincronizado'),error:'Erro na sincronização'}[syncState];
  openSheet('Dados e sincronização',`<div class="result"><dl><dt>Estado</dt><dd style="font-family:var(--font);font-size:15px">${st}</dd><dt>Conexão</dt><dd style="font-family:var(--font);font-size:15px">${navigator.onLine?'Online':'Offline'}</dd>${SY.last?`<dt>Última cópia</dt><dd style="font-family:var(--font);font-size:15px">${new Date(SY.last).toLocaleString(LOC())}</dd>`:''}</dl></div>
   ${SY.err?`<p class="err">${esc(SY.err)}</p>`:''}
   <p class="note">Tudo é salvo primeiro no aparelho e funciona sem internet. ${SY.db?'Quando houver conexão, uma cópia do projeto vai para sua conta (privada) e pode ser restaurada em outro aparelho.':'A cópia na nuvem fica disponível ao abrir o app pelo claude.ai com sua conta.'}</p>
   ${SY.db?`<div class="actions"><button class="btn primary grow" id="sN">Sincronizar agora</button><button class="btn grow" id="sR">Restaurar da nuvem</button></div>`:''}`,b=>{
    if(!SY.db)return;$('#sN',b).onclick=async()=>{await syncNow();closeSheet();toast(syncState==='synced'?t('Sincronizado'):'Sincronização pendente: '+(SY.err||'sem conexão'),{err:syncState!=='synced'});};
    $('#sR',b).onclick=async()=>{if(await ask('Restaurar da nuvem?','O projeto atual neste aparelho será substituído pela cópia da nuvem.',[[t('Cancelar'),'no'],['Restaurar','yes','primary']])==='yes')restoreCloud();};});
}
window.addEventListener('online',()=>{if(syncState==='pending')syncNow();});
window.addEventListener('offline',()=>{if(syncState==='synced')markSync('pending');});

/* ============================================================
   Ajustes
   ============================================================ */
function renderSettings(){
  const sel=(id,opts,v)=>`<select id="${id}">${opts.map(([k,l])=>`<option value="${k}" ${String(k)===String(v)?'selected':''}>${l}</option>`).join('')}</select>`;
  const sw=(id,label,sub,on)=>`<label class="switch"><span><span>${label}</span>${sub?`<small>${sub}</small>`:''}</span><input type="checkbox" id="${id}" ${on?'checked':''}></label>`;
  const row=(label,sub,ctrl)=>`<div class="switch"><span><span>${label}</span>${sub?`<small>${sub}</small>`:''}</span>${ctrl}</div>`;
  const zones=[];for(let z=17;z<=25;z++)zones.push([z,z]);
  $('#setPage').innerHTML=`<h1>${t('Ajustes')}</h1>
   <h2>${t('Interface')}</h2><div class="list">
    ${row(t('Idioma'),'',sel('sLang',[['pt','Português'],['en','English'],['es','Español']],S.lang))}
    ${row('Modo','Simples para iniciantes; avançado mostra coordenadas, fator k e opções extras',sel('sUi',[['simple',t('Simples')],['adv',t('Avançado')]],S.ui))}
    ${row(t('Tema'),'',sel('sTheme',[['auto',t('Automático')],['light',t('Claro')],['dark',t('Escuro')]],S.theme))}
    ${row('Formato de ângulos','',sel('sAng',[['dec','Graus decimais'],['dms','Graus, min, seg']],S.ang))}
   </div>
   <h2>${t('Sistema de referência')}</h2><div class="list">
    ${row('Datum','IBGE adota SIRGAS 2000; diferença para WGS 84 é centimétrica',sel('sDatum',[['sirgas','SIRGAS 2000'],['wgs','WGS 84']],S.datum))}
    ${row('Zona UTM do projeto',`Atual: ${P.zone?P.zone+(P.south?'S':'N'):'automática'} · EPSG:${projCode()}`,`<span style="display:flex;gap:6px">${sel('sZone',[['','Auto'],...zones],P.zone??'')}${sel('sHem',[['S','S'],['N','N']],P.south?'S':'N')}</span>`)}
    <button class="item" id="sCRS"><span class="t"><strong>Sistemas personalizados</strong><small>${(S.customCRS||[]).length} cadastrados · definição proj4 de epsg.io</small></span></button>
   </div>
   <h2>${t('Coleta')}</h2><div class="list">
    ${row(t('Leituras por ponto (média)'),'Mais leituras = posição mais estável',sel('sAvg',[[1,'1'],[5,'5'],[10,'10'],[30,'30'],[60,'60']],S.avgN))}
    ${row(t('Precisão máxima aceita (m)'),'Pede confirmação acima disso',sel('sMax',[[0.5,'0,5'],[1,'1'],[3,'3'],[5,'5'],[10,'10'],[30,'30']],S.maxAcc))}
    ${row('Prefixo de pontos','',`<input id="sPre" class="i" style="width:90px;min-height:40px" value="${esc(S.prefix)}">`)}
    ${S.ui==='adv'?row('Fonte da coleta','Mira: coleta no centro do mapa (digitalização)',sel('sSrc',[['gnss','GNSS'],['cross','Mira no mapa']],S.src))+row('Intervalo do modo contínuo','Distância mínima entre vértices',sel('sCont',[[1,'1 m'],[2,'2 m'],[5,'5 m'],[10,'10 m'],[20,'20 m']],S.contDist)):''}
    ${row('Tolerância de estaqueamento','',sel('sTol',[[0.02,'2 cm'],[0.05,'5 cm'],[0.1,'10 cm'],[0.3,'30 cm'],[1,'1 m'],[3,'3 m']],S.tol))}
    ${row('Exportação CSV','',sel('sCsv',[['br','Excel BR (; e vírgula)'],['intl','Padrão (, e ponto)']],S.csv))}
   </div>
   <h2>${t('Energia e tela')}</h2><div class="list">
    ${sw('sBat',t('Economia de bateria'),'Tema escuro, menos atualizações de tela e de GNSS',S.battery)}
    ${sw('sWake',t('Manter tela ligada'),'Útil no estaqueamento; consome mais bateria',S.wake)}
    ${sw('sSim',t('GNSS simulado'),'Para treinar sem sinal. Toque longo no mapa move a posição',S.sim)}
   </div>
   <h2>${t('Armazenamento e sincronização')}</h2><div class="list">
    <button class="item" id="sSync"><span class="t"><strong>Sincronização</strong><small>${{local:t('Somente neste aparelho'),pending:t('Pendente'),synced:t('Sincronizado'),error:'Erro'}[syncState]}</small></span></button>
    <div class="item"><span class="t"><strong>Espaço usado</strong><small id="sUse">Calculando…</small></span></div>
    <button class="item" id="sGuide"><span class="t"><strong>${t('Primeiros passos')}</strong><small>Rever o guia rápido</small></span></button>
    <button class="item" id="sWipe"><span class="t"><strong style="color:var(--poor)">Apagar projeto atual</strong><small>Remove todas as feições deste projeto</small></span></button>
   </div>
   <p class="note">Marco · levantamento GNSS. Altitudes do navegador são elipsoidais; precisão depende do receptor do aparelho.</p>`;
  const on=(id,ev,fn)=>{const e=$('#'+id);if(e)e.addEventListener(ev,fn);};
  on('sLang','change',e=>{S.lang=e.target.value;saveS();applyI18n();applyUI();renderSettings();updGNSS();});
  on('sUi','change',e=>{S.ui=e.target.value;saveS();applyUI();renderSettings();});
  on('sTheme','change',e=>{S.theme=e.target.value;saveS();applyTheme();});
  on('sAng','change',e=>{S.ang=e.target.value;saveS();});
  on('sDatum','change',e=>{S.datum=e.target.value;saveS();renderSettings();});
  const zc=async()=>{const z=$('#sZone').value,h=$('#sHem').value;if(P.features.length&&!await confirmZone())return renderSettings();P.zone=z?+z:(G.last?zoneOf(G.last.lon):null);P.south=h==='S';clearXY();if(G.last)G.last.xy=toXY(G.last.lon,G.last.lat);touch();renderSettings();if(G.last)centerOn(...G.last.xy);dirty();};
  on('sZone','change',zc);on('sHem','change',zc);
  on('sAvg','change',e=>{S.avgN=+e.target.value;saveS();});on('sMax','change',e=>{S.maxAcc=+e.target.value;saveS();});
  on('sPre','change',e=>{S.prefix=e.target.value.trim().slice(0,6)||'P';saveS();});
  on('sSrc','change',e=>{S.src=e.target.value;saveS();updDock();renderAdv();});on('sCont','change',e=>{S.contDist=+e.target.value;saveS();});
  on('sTol','change',e=>{S.tol=+e.target.value;saveS();if(SO)SO.tol=S.tol;});on('sCsv','change',e=>{S.csv=e.target.value;saveS();});
  on('sBat','change',e=>{S.battery=e.target.checked;saveS();applyTheme();resize();gStart();});
  on('sWake','change',e=>{S.wake=e.target.checked;saveS();wake();});
  on('sSim','change',e=>{S.sim=e.target.checked;saveS();G.last=null;gStart();updGNSS();});
  on('sSync','click',openSync);on('sGuide','click',()=>guide(0));on('sCRS','click',customCRSSheet);
  on('sWipe','click',async()=>{if(await ask('Apagar projeto atual?',`As ${P.features.length} feições de “${P.name}” serão removidas deste aparelho e da cópia sincronizada.`,[[t('Cancelar'),'no'],['Apagar','yes','primary']])!=='yes')return;const nm=P.name;P=newProject(nm);touch();dirty();updDock();renderSettings();toast('Projeto apagado');});
  (async()=>{let s=`${P.features.length} feições`;try{const j=JSON.stringify(P,(k,v)=>k.startsWith('_')?undefined:v).length;s+=` · projeto ${fmt(j/1024,0)} kB`;if(navigator.storage&&navigator.storage.estimate){const e=await navigator.storage.estimate();s+=` · aparelho ${fmt((e.usage||0)/1048576,1)} de ${fmt((e.quota||0)/1048576,0)} MB`;}}catch(e){}const el=$('#sUse');if(el)el.textContent=s;})();
}
function confirmZone(){return ask('Mudar zona UTM?','As feições continuam no lugar (são guardadas em lat/lon). Apenas as coordenadas E/N exibidas e exportadas passam para a nova zona.',[[t('Cancelar'),'no'],['Mudar','yes','primary']]).then(r=>r==='yes');}
function customCRSSheet(){
  const draw=b=>{b.innerHTML=`<div class="list" style="margin-bottom:12px">${(S.customCRS||[]).length?S.customCRS.map((c,i)=>`<div class="item"><span class="t"><strong>EPSG:${c.code} ${esc(c.name||'')}</strong><small style="word-break:break-all">${esc(c.def)}</small></span><button class="btn danger" data-rm="${i}">×</button></div>`).join(''):'<div class="empty" style="padding:12px">Nenhum sistema personalizado.</div>'}</div>
    <div class="row2"><label class="f"><span>Código EPSG</span><input class="i" id="cc" inputmode="numeric"></label><label class="f"><span>Nome</span><input class="i" id="cn"></label></div>
    <label class="f"><span>Definição proj4</span><textarea class="i" id="cd" style="min-height:80px" placeholder="+proj=utm +zone=22 +south +ellps=GRS80 +units=m +no_defs"></textarea></label>
    <button class="btn primary" style="width:100%" id="ca">Adicionar</button>`;
    $$('[data-rm]',b).forEach(x=>x.onclick=()=>{S.customCRS.splice(+x.dataset.rm,1);saveS();draw(b);});
    $('#ca',b).onclick=()=>{const code=parseInt($('#cc',b).value,10),def=$('#cd',b).value.trim();if(!code||!/^\+proj=/.test(def)){toast('Informe o código e uma definição proj4 começando com +proj=.',{err:true});return;}
      if(window.proj4){try{proj4(def,'WGS84',[0,0]);}catch(e){toast('Definição proj4 inválida.',{err:true});return;}}
      S.customCRS=(S.customCRS||[]).filter(c=>c.code!==code);S.customCRS.push({code,name:$('#cn',b).value.trim(),def});saveS();draw(b);toast('Sistema adicionado');};};
  openSheet('Sistemas personalizados','',draw);
}
function applyTheme(){const th=S.battery?'dark':S.theme;if(th==='auto')delete document.documentElement.dataset.theme;else document.documentElement.dataset.theme=th;readColors();}
let wl=null;async function wake(){try{if(S.wake&&!S.battery&&document.visibilityState==='visible'&&navigator.wakeLock){wl=await navigator.wakeLock.request('screen');}else if(wl){await wl.release();wl=null;}}catch(e){}}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',readColors);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'){if(!DR||!DR.cont)gStop();persist();}else{gStart();wake();}});

/* ============================================================
   Guia de primeiros passos
   ============================================================ */
const GUIDE=[
  ['Bem-vindo ao Marco','Levantamento GNSS de bolso: colete pontos, linhas e polígonos, faça estaqueamento e cálculos COGO — tudo offline.'],
  ['Olhe o sinal antes de coletar','O indicador no topo mostra a precisão: verde é bom (até 5 m em celulares), amarelo exige cuidado, vermelho é fraco. Toque nele para detalhes.'],
  ['Coletar é um toque','Escolha Ponto, Linha ou Polígono e toque no botão amarelo. Para linhas e polígonos, cada toque grava um vértice; depois toque em Finalizar.'],
  ['Exporte e compartilhe','Em Dados você exporta CSV, KML, GPX, GeoJSON, DXF e Shapefile para QGIS, AutoCAD ou Google Earth.']];
function guide(i){
  let el=$('#guide');if(!el){el=document.createElement('div');el.id='guide';document.body.appendChild(el);}
  if(i>=GUIDE.length){el.remove();S.seenGuide=true;saveS();return;}
  el.innerHTML=`<div class="card" role="dialog" aria-modal="true"><div class="dots">${GUIDE.map((_,k)=>`<i class="${k<=i?'on':''}"></i>`).join('')}</div><h3>${GUIDE[i][0]}</h3><p>${GUIDE[i][1]}</p>
   <div class="actions"><button class="btn" id="gS">${t('Pular')}</button><button class="btn primary grow" id="gN">${i<GUIDE.length-1?t('Próximo'):t('Começar')}</button></div></div>`;
  $('#gS',el).onclick=()=>guide(GUIDE.length);$('#gN',el).onclick=()=>guide(i+1);$('#gN',el).focus();
}

/* ============================================================
   Inicialização
   ============================================================ */
(async function init(){
  await IDB.open();
  P=await IDB.get('project');
  if(!P||!P.layers){const old=(()=>{try{return JSON.parse(localStorage.getItem('marco.project'))}catch(e){return null}})();P=old||newProject();await persist();}
  P.active=P.active||{};
  const bg=await IDB.get('bg');if(bg)await setBG(bg);
  applyTheme();applyI18n();resize();
  new ResizeObserver(()=>{document.documentElement.style.setProperty('--dockH',dockH()+'px');}).observe($('#dock'));
  window.addEventListener('resize',resize);
  if(!V.ready){const b=bbox();if(b){V.ready=true;fitTo(b);setFollow(true);}else{V.ready=true;const c=fromXY(500000,8250000);V.cx=500000;V.cy=8250000;V.s=1;}}
  applyUI();gStart();wake();dirty();
  if(!S.seenGuide)guide(0);
  initSync();
})();
</script>
