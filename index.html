<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0e7c66">
<title>TopoGNSS — Levantamento Topográfico</title>
<style>
:root{
  --bg:#eef2f4;--surface:#fff;--surface2:#f6f9fa;--line:#dde5e9;
  --text:#10222b;--muted:#5f7079;--primary:#0e7c66;--primary-d:#0a5e4d;
  --accent:#ff7a18;--danger:#d64545;--r:14px;
  --shadow:0 6px 24px rgba(16,34,43,.14);
  --fix:#0e9f6e;--float:#e8a33d;--dgps:#e8853d;--gps:#3b82c4;--none:#8a9aa3;
}
[data-theme=dark]{
  --bg:#0d1518;--surface:#152026;--surface2:#1b272e;--line:#26353d;
  --text:#e8f0f3;--muted:#8ba0aa;--shadow:0 6px 24px rgba(0,0,0,.55);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overscroll-behavior:none}
body{
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background:var(--bg);color:var(--text);font-size:15px;overflow:hidden;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select,textarea{font:inherit;color:var(--text);background:var(--surface2);
  border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--primary)}
#app{position:fixed;inset:0;display:flex;flex-direction:column}

/* ---------- topo ---------- */
#topbar{
  position:absolute;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;gap:8px;
  padding:8px 10px;pointer-events:none;
}
#topbar>*{pointer-events:auto}
.pill{
  display:flex;align-items:center;gap:7px;background:var(--surface);
  border-radius:999px;padding:8px 14px;font-weight:700;font-size:13px;
  box-shadow:var(--shadow);letter-spacing:.3px;
}
.pill .dot{width:10px;height:10px;border-radius:50%;background:var(--none);flex:none}
.pill.fix .dot{background:var(--fix);box-shadow:0 0 0 4px rgba(14,159,110,.22)}
.pill.float .dot{background:var(--float)}
.pill.dgps .dot{background:var(--dgps)}
.pill.gps .dot{background:var(--gps)}
.pill.fix{color:var(--fix)}
#statMini{
  background:var(--surface);border-radius:999px;padding:8px 12px;font-size:12px;
  font-weight:600;color:var(--muted);box-shadow:var(--shadow);white-space:nowrap;
}
.icon-btn{
  width:42px;height:42px;border-radius:50%;background:var(--surface);
  display:grid;place-items:center;box-shadow:var(--shadow);font-size:18px;margin-left:auto;
}

/* ---------- mapa ---------- */
#mapWrap{position:absolute;inset:0;overflow:hidden;background:var(--bg)}
#map{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#attrib{position:absolute;right:6px;bottom:96px;font-size:10px;color:#6b7b84;
  background:rgba(255,255,255,.72);padding:2px 6px;border-radius:6px;pointer-events:none}
[data-theme=dark] #attrib{background:rgba(0,0,0,.5);color:#a8bcc4}
#hud{
  position:absolute;left:10px;bottom:96px;background:var(--surface);border-radius:12px;
  padding:8px 12px;box-shadow:var(--shadow);font-variant-numeric:tabular-nums;
  min-width:170px;pointer-events:none;
}
#hudCoord{font-weight:700;font-size:14px;letter-spacing:.2px}
#hudSub{font-size:11px;color:var(--muted);margin-top:2px}
#scalebar{position:absolute;right:12px;bottom:118px;display:flex;flex-direction:column;
  align-items:flex-end;gap:2px;pointer-events:none}
#scalebarLine{height:4px;border:1.5px solid #52636c;border-top:0;min-width:40px}
#scalebarText{font-size:10px;font-weight:700;color:#52636c;background:rgba(255,255,255,.7);
  padding:0 4px;border-radius:4px}
#sideTools{position:absolute;right:10px;top:70px;display:flex;flex-direction:column;gap:8px}
#sideTools button{
  width:44px;height:44px;border-radius:12px;background:var(--surface);box-shadow:var(--shadow);
  font-size:20px;font-weight:700;display:grid;place-items:center;color:var(--text)
}
#sideTools button.on{background:var(--primary);color:#fff}
#stakeBanner{
  position:absolute;left:10px;right:10px;bottom:172px;background:var(--surface);
  border-radius:16px;box-shadow:var(--shadow);padding:12px 14px;display:flex;gap:12px;align-items:center;
  border-left:5px solid var(--accent);
}
#stakeArrow{width:46px;height:46px;flex:none;display:grid;place-items:center;font-size:26px;
  transition:transform .25s ease}
#stakeInfo{flex:1;min-width:0}
#stakeDist{font-size:22px;font-weight:800;line-height:1.05}
#stakeMeta{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

/* ---------- barra de ações ---------- */
#actionbar{
  position:absolute;left:0;right:0;bottom:0;z-index:25;display:flex;
  background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
  box-shadow:0 -4px 20px rgba(16,34,43,.09);
}
.abtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 2px 9px;
  font-size:10.5px;font-weight:600;color:var(--muted)}
.abtn svg{width:23px;height:23px;fill:currentColor}
.abtn:active{background:var(--surface2)}
.abtn.active{color:var(--primary)}
#collectbar{
  position:absolute;left:0;right:0;bottom:0;z-index:26;display:flex;gap:8px;align-items:center;
  background:var(--surface);border-top:2px solid var(--accent);padding:10px 12px;
  padding-bottom:calc(10px + env(safe-area-inset-bottom));box-shadow:0 -4px 20px rgba(16,34,43,.12);
}
#collectInfo{flex:1;font-size:12.5px;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#collectbar button{border-radius:11px;padding:11px 13px;font-weight:700;font-size:13px}
#btnVertex{background:var(--primary);color:#fff}
#btnUndo,#btnCancel{background:var(--surface2);color:var(--muted)}
#btnFinish{background:var(--accent);color:#fff}

/* ---------- sheet ---------- */
#sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);
  border-radius:20px 20px 0 0;box-shadow:0 -8px 40px rgba(0,0,0,.28);
  transform:translateY(100%);transition:transform .22s cubic-bezier(.32,.72,0,1);
  max-height:86vh;display:flex;flex-direction:column;
  padding-bottom:env(safe-area-inset-bottom);
}
#sheet.open{transform:translateY(0)}
.sheet-grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:9px auto 0;flex:none}
.sheet-head{display:flex;align-items:center;padding:6px 18px 10px;flex:none}
.sheet-head h2{margin:0;font-size:17px;font-weight:800;flex:1}
#sheetClose{width:34px;height:34px;border-radius:50%;background:var(--surface2);font-size:15px;
  display:grid;place-items:center;color:var(--muted)}
.sheet-body{overflow-y:auto;padding:0 16px 26px;-webkit-overflow-scrolling:touch}

/* ---------- componentes ---------- */
.row{display:flex;gap:8px;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.card{background:var(--surface2);border:1px solid var(--line);border-radius:var(--r);
  padding:12px;margin-bottom:10px}
.card h3{margin:0 0 8px;font-size:13px;font-weight:800;text-transform:uppercase;
  letter-spacing:.6px;color:var(--muted)}
.btn{background:var(--surface2);border:1px solid var(--line);border-radius:11px;
  padding:12px 14px;font-weight:700;font-size:14px;text-align:center;display:block;width:100%}
.btn:active{background:var(--line)}
.btn.primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn.accent{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.danger{background:#fdecec;color:var(--danger);border-color:#f6cfcf}
[data-theme=dark] .btn.danger{background:#3a1c1c;border-color:#5a2a2a}
.btn.sm{padding:8px 11px;font-size:12.5px;width:auto}
label.f{display:block;margin-bottom:10px}
label.f span{display:block;font-size:11.5px;font-weight:700;color:var(--muted);
  margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px}
.out{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;
  background:var(--surface2);border:1px solid var(--line);border-radius:10px;
  padding:10px;white-space:pre-wrap;line-height:1.6;margin:8px 0 0}
.list{display:flex;flex-direction:column;gap:6px}
.item{display:flex;align-items:center;gap:10px;background:var(--surface2);
  border:1px solid var(--line);border-radius:11px;padding:10px 12px}
.item .nm{flex:1;min-width:0}
.item .nm b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .nm small{color:var(--muted);font-size:11.5px}
.chip{width:13px;height:13px;border-radius:4px;flex:none}
.tag{font-size:10px;font-weight:800;padding:3px 7px;border-radius:6px;
  background:var(--line);color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
#toast{
  position:fixed;left:50%;bottom:110px;transform:translateX(-50%);z-index:60;
  background:#10222b;color:#fff;padding:11px 18px;border-radius:12px;font-size:13.5px;
  font-weight:600;box-shadow:0 8px 30px rgba(0,0,0,.35);max-width:88vw;text-align:center;
  animation:tin .18s ease;
}
@keyframes tin{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
.switch{display:flex;align-items:center;justify-content:space-between;padding:10px 0;
  border-bottom:1px solid var(--line)}
.switch:last-child{border-bottom:0}
.switch b{font-weight:600;font-size:14px}
.switch small{display:block;color:var(--muted);font-size:11.5px;font-weight:400;margin-top:1px}
.tg{width:50px;height:29px;border-radius:15px;background:var(--line);position:relative;
  transition:background .18s;flex:none}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:23px;height:23px;border-radius:50%;
  background:#fff;transition:transform .18s;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.tg.on{background:var(--primary)}
.tg.on::after{transform:translateX(21px)}
</style>
</head>
<body>
<div id="app">

  <!-- TOPO -->
  <div id="topbar">
    <div id="fixPill" class="pill none"><span class="dot"></span><span id="fixText">—</span></div>
    <div id="statMini">Sats — · HDOP —</div>
    <button class="icon-btn" onclick="actSettings()" aria-label="Ajustes">⚙</button>
  </div>

  <!-- MAPA -->
  <div id="mapWrap">
    <canvas id="map"></canvas>
    <div id="attrib">© OpenStreetMap</div>
    <div id="sideTools">
      <button data-tool="in" aria-label="Zoom +">＋</button>
      <button data-tool="out" aria-label="Zoom −">−</button>
      <button data-tool="loc" id="btnFollow" aria-label="Centralizar">◎</button>
    </div>
    <div id="scalebar"><div id="scalebarLine"></div><div id="scalebarText">—</div></div>
    <div id="hud"><div id="hudCoord">—</div><div id="hudSub">aguardando sinal GNSS…</div></div>
    <div id="stakeBanner" hidden>
      <div id="stakeArrow">➤</div>
      <div id="stakeInfo">
        <div id="stakeDist">—</div>
        <div id="stakeMeta">—</div>
      </div>
      <button class="btn sm" onclick="clearStakeout()">Sair</button>
    </div>
  </div>

  <!-- BARRA -->
  <nav id="actionbar">
    <button class="abtn" onclick="actPoint()">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
      <span>Ponto</span></button>
    <button class="abtn" onclick="actLine()">
      <svg viewBox="0 0 24 24"><path d="M5 19L19 5" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round"/><circle cx="5" cy="19" r="2.6"/><circle cx="19" cy="5" r="2.6"/></svg>
      <span>Linha</span></button>
    <button class="abtn" onclick="actPoly()">
      <svg viewBox="0 0 24 24"><path d="M12 3.5l8 6-3 10.5H7L4 9.5z" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linejoin="round"/></svg>
      <span>Polígono</span></button>
    <button class="abtn" onclick="actData()">
      <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" fill="none"/></svg>
      <span>Dados</span></button>
    <button class="abtn" onclick="actMenu()">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
      <span>Mais</span></button>
  </nav>

  <div id="collectbar" hidden>
    <span id="collectInfo">—</span>
    <button id="btnUndo" onclick="undoVertex()">↶</button>
    <button id="btnVertex" onclick="addVertex()">+ Vértice</button>
    <button id="btnFinish" onclick="finishCollect()">Concluir</button>
    <button id="btnCancel" onclick="cancelCollect()">✕</button>
  </div>

  <!-- SHEET -->
  <div id="sheet" hidden>
    <div class="sheet-grab"></div>
    <div class="sheet-head"><h2 id="sheetTitle"></h2><button id="sheetClose" onclick="closeSheet()">✕</button></div>
    <div id="sheetBody" class="sheet-body"></div>
  </div>

  <div id="toast" hidden></div>
</div>

<script>
'use strict';
/* ══════════════════════════════════════════════════════════════
   1. UTILITÁRIOS
   ══════════════════════════════════════════════════════════════ */
const $  = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const D2R = Math.PI/180, R2D = 180/Math.PI;
const clamp = (v,a,b)=> v<a?a:(v>b?b:v);
const uid = ()=> Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const nf = (v,d=2)=> (v==null||!isFinite(v)) ? '—'
  : Number(v).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let toastT;
function toast(msg, ms=2400){
  const t=$('#toast'); t.textContent=msg; t.hidden=false;
  clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true, ms);
}

/* ══════════════════════════════════════════════════════════════
   2. IDIOMAS (pt-BR padrão; en como alternativa)
   ══════════════════════════════════════════════════════════════ */
const EN = {
 'Ponto':'Point','Linha':'Line','Polígono':'Polygon','Dados':'Data','Mais':'More',
 'Concluir':'Finish','Cancelar':'Cancel','Salvar':'Save','Excluir':'Delete','Voltar':'Back',
 'Nome':'Name','Código':'Code','Camada':'Layer','Atributos':'Attributes','Altitude':'Elevation',
 'Novo ponto':'New point','Nova feição':'New feature','Camadas':'Layers','Feições':'Features',
 'Estaquear':'Stakeout','Ampliar':'Zoom to','Sem posição GNSS':'No GNSS position',
 'Configurações':'Settings','Importar / Exportar':'Import / Export','Ferramentas COGO':'COGO Tools',
 'Sistema de coordenadas':'Coordinate system','Tema escuro':'Dark theme','Economia de bateria':'Battery saver',
 'Idioma':'Language','Simular GNSS':'Simulate GNSS','GNSS externo (BLE)':'External GNSS (BLE)',
 'Conectar':'Connect','Desconectar':'Disconnect','Exportar CSV':'Export CSV','Exportar KML':'Export KML',
 'Exportar GPX':'Export GPX','Exportar GeoJSON':'Export GeoJSON','Exportar DXF':'Export DXF',
 'Exportar Shapefile':'Export Shapefile','Importar arquivo':'Import file'
};
function t(s){ return state.settings.lang==='en' ? (EN[s]||s) : s; }

/* ══════════════════════════════════════════════════════════════
   3. ESTADO E PERSISTÊNCIA
   ══════════════════════════════════════════════════════════════ */
const DB_KEY='topognss.v1';
const PALETTE=['#0e7c66','#3b82c4','#e8853d','#b455d6','#d64545','#0e9f6e','#8a6d3b','#2c8f9e'];

function defaults(){
  return {
    layers:[{id:'l1',name:'Geral',color:PALETTE[0],visible:true}],
    features:[],
    settings:{
      theme:'light', lang:'pt', crs:'auto',
      tileUrl:'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
      battery:false, gpsSource:'internal', stakeTol:0.05, sim:false
    }
  };
}
function loadState(){
  try{ const s=JSON.parse(localStorage.getItem(DB_KEY)); if(s&&Array.isArray(s.layers)) return s; }catch(e){}
  return null;
}
let state = loadState() || defaults();
state.settings = Object.assign(defaults().settings, state.settings||{});

let saveT;
function save(){
  clearTimeout(saveT);
  saveT = setTimeout(()=>{ try{ localStorage.setItem(DB_KEY, JSON.stringify(state)); }catch(e){ console.warn(e); } }, 250);
}

/* ══════════════════════════════════════════════════════════════
   4. SISTEMAS DE COORDENADAS (WGS84 / SIRGAS / UTM)
   ══════════════════════════════════════════════════════════════ */
const CRS = {
  parse(code){
    const n = parseInt(String(code).toUpperCase().replace('EPSG:','').trim(),10);
    if(!isFinite(n)) return null;
    if(n===4326) return {type:'geo',epsg:n,name:'WGS 84 (geográficas)'};
    if(n===4674||n===9001) return {type:'geo',epsg:n,name:'SIRGAS 2000 (geográficas)'};
    if(n===3857) return {type:'merc',epsg:n,name:'Web Mercator'};
    if(n>=32601&&n<=32660) return {type:'utm',zone:n-32600,hemi:'N',epsg:n,name:`WGS 84 / UTM ${n-32600}N`};
    if(n>=32701&&n<=32760) return {type:'utm',zone:n-32700,hemi:'S',epsg:n,name:`WGS 84 / UTM ${n-32700}S`};
    if(n>=31954&&n<=31965) return {type:'utm',zone:n-31942,hemi:'N',epsg:n,name:`SIRGAS 2000 / UTM ${n-31942}N`};
    if(n>=31978&&n<=31985) return {type:'utm',zone:n-31960,hemi:'S',epsg:n,name:`SIRGAS 2000 / UTM ${n-31960}S`};
    return null;
  },
  auto(lat,lon){
    const zone = Math.floor((lon+180)/6)+1;
    const hemi = lat>=0?'N':'S';
    const epsg = hemi==='N' ? 32600+zone : 32700+zone;
    return {type:'utm',zone,hemi,epsg,name:`UTM ${zone}${hemi} (automático)`};
  }
};

function utmForward(lat,lon,zone,hemi){
  const a=6378137, f=1/298.257223563, k0=0.9996;
  const e2=f*(2-f), ep2=e2/(1-e2);
  const phi=lat*D2R, lam=lon*D2R, lam0=((zone-1)*6-180+3)*D2R;
  const N=a/Math.sqrt(1-e2*Math.sin(phi)**2);
  const T=Math.tan(phi)**2, C=ep2*Math.cos(phi)**2;
  const A=Math.cos(phi)*(lam-lam0);
  const M=a*((1-e2/4-3*e2*e2/64-5*e2**3/256)*phi
    -(3*e2/8+3*e2*e2/32+45*e2**3/1024)*Math.sin(2*phi)
    +(15*e2*e2/256+45*e2**3/1024)*Math.sin(4*phi)
    -(35*e2**3/3072)*Math.sin(6*phi));
  const e=k0*N*(A+(1-T+C)*A**3/6+(5-18*T+T*T+72*C-58*ep2)*A**5/120)+500000;
  let n=k0*(M+N*Math.tan(phi)*(A*A/2+(5-T+9*C+4*C*C)*A**4/24
    +(61-58*T+T*T+600*C-330*ep2)*A**6/720));
  if(hemi==='S') n+=10000000;
  return {e,n};
}

function utmInverse(e,n,zone,hemi){
  const a=6378137, f=1/298.257223563, k0=0.9996;
  const e2=f*(2-f), ep2=e2/(1-e2);
  const e1=(1-Math.sqrt(1-e2))/(1+Math.sqrt(1-e2));
  const x=e-500000;
  let y=n; if(hemi==='S') y-=10000000;
  const M=y/k0;
  const mu=M/(a*(1-e2/4-3*e2*e2/64-5*e2**3/256));
  const phi1=mu+(3*e1/2-27*e1**3/32)*Math.sin(2*mu)
    +(21*e1*e1/16-55*e1**4/32)*Math.sin(4*mu)+(151*e1**3/96)*Math.sin(6*mu);
  const C1=ep2*Math.cos(phi1)**2, T1=Math.tan(phi1)**2;
  const N1=a/Math.sqrt(1-e2*Math.sin(phi1)**2);
  const R1=a*(1-e2)/Math.pow(1-e2*Math.sin(phi1)**2,1.5);
  const D=x/(N1*k0);
  const lat=phi1-(N1*Math.tan(phi1)/R1)*(D*D/2-(5+3*T1+10*C1-4*C1*C1-9*ep2)*D**4/24
    +(61+90*T1+298*C1+45*T1*T1-252*ep2-3*C1*C1)*D**6/720);
  const lon=((zone-1)*6-180+3)*D2R+(D-(1+2*T1+C1)*D**3/6
    +(5-2*C1+28*T1-3*C1*C1+8*ep2+24*T1*T1)*D**5/120)/Math.cos(phi1);
  return {lat:lat*R2D, lon:lon*R2D};
}

function currentCRS(){
  const s=state.settings.crs;
  if(s && s!=='auto'){ const r=CRS.parse(s); if(r) return r; }
  if(gnss.lat!=null) return CRS.auto(gnss.lat,gnss.lon);
  return CRS.parse('EPSG:4326');
}
function toXY(lat,lon,cs){
  if(cs.type==='utm'){ const r=utmForward(lat,lon,cs.zone,cs.hemi); return {x:r.e,y:r.n}; }
  if(cs.type==='merc'){
    const x=(lon+180)/360*20037508.34;
    const y=Math.log(Math.tan((90+lat)*D2R/2))/Math.PI*20037508.34;
    return {x,y};
  }
  return {x:lon,y:lat};
}
function fromXY(x,y,cs){
  if(cs.type==='utm'){ const r=utmInverse(x,y,cs.zone,cs.hemi); return {lat:r.lat,lon:r.lon}; }
  if(cs.type==='merc'){
    const lon=x/20037508.34*180;
    const lat=R2D*(2*Math.atan(Math.exp(y/20037508.34*Math.PI))-Math.PI/2);
    return {lat,lon};
  }
  return {lat:y,lon:x};
}
function fmtXY(lat,lon,cs){
  const p=toXY(lat,lon,cs);
  if(cs.type==='utm') return `E ${nf(p.x,2)}  N ${nf(p.y,2)}`;
  if(cs.type==='merc') return `X ${nf(p.x,2)}  Y ${nf(p.y,2)}`;
  return `${nf(lat,7)}°  ${nf(lon,7)}°`;
}

/* ══════════════════════════════════════════════════════════════
   5. GEOMETRIA
   ══════════════════════════════════════════════════════════════ */
function haversine(lat1,lon1,lat2,lon2){
  const R=6371008.8, dLat=(lat2-lat1)*D2R, dLon=(lon2-lon1)*D2R;
  const a=Math.sin(dLat/2)**2+Math.cos(lat1*D2R)*Math.cos(lat2*D2R)*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.min(1,Math.sqrt(a)));
}
function bearing(lat1,lon1,lat2,lon2){
  const p1=lat1*D2R,p2=lat2*D2R,dl=(lon2-lon1)*D2R;
  const y=Math.sin(dl)*Math.cos(p2);
  const x=Math.cos(p1)*Math.sin(p2)-Math.sin(p1)*Math.cos(p2)*Math.cos(dl);
  return (Math.atan2(y,x)*R2D+360)%360;
}
function utmOfPoints(coords){
  const c=coords[Math.floor(coords.length/2)];
  const cs=CRS.auto(c[1],c[0]);
  return coords.map(p=>utmForward(p[1],p[0],cs.zone,cs.hemi));
}
function polygonMetrics(coords){
  if(coords.length<3) return {area:0,perimeter:0};
  const pts=utmOfPoints(coords);
  let s=0,per=0;
  for(let i=0;i<pts.length;i++){
    const j=(i+1)%pts.length;
    s+=pts[i].e*pts[j].n-pts[j].e*pts[i].n;
    per+=Math.hypot(pts[j].e-pts[i].e,pts[j].n-pts[i].n);
  }
  return {area:Math.abs(s/2),perimeter:per};
}
function lineMetrics(coords){
  let d=0;
  for(let i=1;i<coords.length;i++){
    d+=haversine(coords[i-1][1],coords[i-1][0],coords[i][1],coords[i][0]);
  }
  return {length:d};
}

/* ══════════════════════════════════════════════════════════════
   6. BANCO DE TILES (IndexedDB) — mapa offline
   ══════════════════════════════════════════════════════════════ */
let idb=null;
function openIDB(){
  return new Promise(res=>{
    try{
      const r=indexedDB.open('topognss-tiles',1);
      r.onupgradeneeded=e=>{ e.target.result.createObjectStore('tiles'); };
      r.onsuccess=e=>{ idb=e.target.result; res(idb); };
      r.onerror=()=>res(null);
    }catch(e){ res(null); }
  });
}
function idbGet(k){
  return new Promise(res=>{
    if(!idb) return res(null);
    try{
      const q=idb.transaction('tiles','readonly').objectStore('tiles').get(k);
      q.onsuccess=()=>res(q.result||null); q.onerror=()=>res(null);
    }catch(e){ res(null); }
  });
}
function idbPut(k,v){
  if(!idb) return;
  try{ idb.transaction('tiles','readwrite').objectStore('tiles').put(v,k); }catch(e){}
}

/* ══════════════════════════════════════════════════════════════
   7. MOTOR DE MAPA (canvas, sem dependências)
   ══════════════════════════════════════════════════════════════ */
const mapCv=$('#map'), ctx=mapCv.getContext('2d');
const TILE=256;
const view={lat:-23.5505, lon:-46.6333, zoom:17};
let W=0,H=0,DPR=1, follow=true;

const lon2x=(lon,z)=>(lon+180)/360*TILE*Math.pow(2,z);
const lat2y=(lat,z)=>{
  const s=Math.sin(clamp(lat,-85.05112878,85.05112878)*D2R);
  return (0.5-Math.log((1+s)/(1-s))/(4*Math.PI))*TILE*Math.pow(2,z);
};
const x2lon=(x,z)=> x/(TILE*Math.pow(2,z))*360-180;
const y2lat=(y,z)=>{
  const n=Math.PI-2*Math.PI*y/(TILE*Math.pow(2,z));
  return R2D*Math.atan(0.5*(Math.exp(n)-Math.exp(-n)));
};
function toScreen(lat,lon){
  return {
    x: lon2x(lon,view.zoom)-lon2x(view.lon,view.zoom)+W/2,
    y: lat2y(lat,view.zoom)-lat2y(view.lat,view.zoom)+H/2
  };
}
function toLatLon(sx,sy){
  return {
    lon: x2lon(sx-W/2+lon2x(view.lon,view.zoom), view.zoom),
    lat: y2lat(sy-H/2+lat2y(view.lat,view.zoom), view.zoom)
  };
}
function mpp(){ return 156543.03392*Math.cos(view.lat*D2R)/Math.pow(2,view.zoom); }

const tileCache=new Map(), tilePending=new Map();
async function requestTile(z,x,y){
  const key=`${z}/${x}/${y}`;
  if(tilePending.has(key)) return;
  tilePending.set(key,true);
  let bmp=null;
  try{
    const blob=await idbGet(key);
    if(blob) bmp=await createImageBitmap(blob);
  }catch(e){}
  if(!bmp && navigator.onLine && state.settings.tileUrl){
    try{
      const url=state.settings.tileUrl.replace('{z}',z).replace('{x}',x).replace('{y}',y).replace('{s}','a');
      const r=await fetch(url,{mode:'cors',cache:'force-cache'});
      if(r.ok){
        const blob=await r.blob();
        idbPut(key,blob);
        bmp=await createImageBitmap(blob);
      }
    }catch(e){}
  }
  tilePending.delete(key);
  if(bmp){
    tileCache.set(key,bmp);
    if(tileCache.size>420){ tileCache.delete(tileCache.keys().next().value); }
    draw();
  }
}

function drawTiles(){
  const tz=clamp(Math.round(view.zoom),1,19);
  const k=Math.pow(2,view.zoom-tz);
  const cx=lon2x(view.lon,tz), cy=lat2y(view.lat,tz);
  const left=cx-(W/2)/k, top=cy-(H/2)/k;
  const x0=Math.floor(left/TILE), x1=Math.floor((left+W/k)/TILE);
  const y0=Math.floor(top/TILE),  y1=Math.floor((top+H/k)/TILE);
  const max=Math.pow(2,tz);
  let drawn=0;
  for(let ty=y0;ty<=y1;ty++){
    if(ty<0||ty>=max) continue;
    for(let tx=x0;tx<=x1;tx++){
      const wx=((tx%max)+max)%max;
      const img=tileCache.get(`${tz}/${wx}/${ty}`);
      const dx=(tx*TILE-left)*k, dy=(ty*TILE-top)*k, ds=TILE*k;
      if(img){ ctx.drawImage(img,dx,dy,ds+.7,ds+.7); drawn++; }
      else requestTile(tz,wx,ty);
    }
  }
  return drawn;
}

function drawGridFallback(){
  ctx.fillStyle = state.settings.theme==='dark' ? '#101a1f' : '#e8eef1';
  ctx.fillRect(0,0,W,H);
  ctx.strokeStyle = state.settings.theme==='dark' ? '#1b2a32' : '#d6e0e5';
  ctx.lineWidth=1;
  const step=90;
  ctx.beginPath();
  for(let x=0;x<W;x+=step){ ctx.moveTo(x,0); ctx.lineTo(x,H); }
  for(let y=0;y<H;y+=step){ ctx.moveTo(0,y); ctx.lineTo(W,y); }
  ctx.stroke();
}

function layerOf(id){ return state.layers.find(l=>l.id===id); }

function drawFeatures(){
  // polígonos e linhas
  for(const f of state.features){
    const lay=layerOf(f.layerId); if(lay && !lay.visible) continue;
    const col=(lay&&lay.color)||'#0e7c66';
    if(f.type==='polygon'){
      ctx.beginPath();
      f.coords.forEach((p,i)=>{ const s=toScreen(p[1],p[0]); i?ctx.lineTo(s.x,s.y):ctx.moveTo(s.x,s.y); });
      ctx.closePath();
      ctx.fillStyle=hexA(col,.20); ctx.fill();
      ctx.strokeStyle=col; ctx.lineWidth=2; ctx.stroke();
    } else if(f.type==='line'){
      ctx.beginPath();
      f.coords.forEach((p,i)=>{ const s=toScreen(p[1],p[0]); i?ctx.lineTo(s.x,s.y):ctx.moveTo(s.x,s.y); });
      ctx.strokeStyle=col; ctx.lineWidth=2.5; ctx.lineJoin='round'; ctx.stroke();
    }
  }
  // pontos
  for(const f of state.features){
    if(f.type!=='point') continue;
    const lay=layerOf(f.layerId); if(lay && !lay.visible) continue;
    const col=(lay&&lay.color)||'#0e7c66';
    const p=f.coords[0], s=toScreen(p[1],p[0]);
    if(s.x<-30||s.y<-30||s.x>W+30||s.y>H+30) continue;
    ctx.beginPath(); ctx.arc(s.x,s.y,7,0,7); ctx.fillStyle=col; ctx.fill();
    ctx.lineWidth=2.2; ctx.strokeStyle='#fff'; ctx.stroke();
    if(view.zoom>=16.5 && f.name){
      ctx.font='600 11px system-ui,sans-serif';
      ctx.textAlign='center';
      ctx.fillStyle='rgba(0,0,0,.55)';
      const w=ctx.measureText(f.name).width;
      ctx.fillRect(s.x-w/2-4,s.y-26,w+8,15);
      ctx.fillStyle='#fff';
      ctx.fillText(f.name,s.x,s.y-15);
    }
  }
}

function hexA(hex,a){
  const h=hex.replace('#','');
  const n=parseInt(h.length===3?h.split('').map(c=>c+c).join(''):h,16);
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;
}

function drawCollecting(){
  if(!collecting) return;
  const pts=collecting.coords.slice();
  if(gnss.lat!=null && !collecting.freeze) pts.push([gnss.lon,gnss.lat,gnss.alt]);
  if(pts.length<1) return;
  ctx.save();
  ctx.setLineDash([7,6]);
  ctx.beginPath();
  pts.forEach((p,i)=>{ const s=toScreen(p[1],p[0]); i?ctx.lineTo(s.x,s.y):ctx.moveTo(s.x,s.y); });
  if(collecting.type==='polygon' && pts.length>2) ctx.closePath();
  ctx.strokeStyle='#ff7a18'; ctx.lineWidth=2.6; ctx.stroke();
  ctx.restore();
  pts.forEach(p=>{
    const s=toScreen(p[1],p[0]);
    ctx.beginPath(); ctx.arc(s.x,s.y,4.5,0,7);
    ctx.fillStyle='#ff7a18'; ctx.fill();
    ctx.strokeStyle='#fff'; ctx.lineWidth=1.8; ctx.stroke();
  });
}

function drawPosition(){
  if(gnss.lat==null) return;
  const s=toScreen(gnss.lat,gnss.lon);
  if(gnss.acc!=null && isFinite(gnss.acc)){
    const rPx=gnss.acc/mpp();
    if(rPx>3 && rPx<4000){
      ctx.beginPath(); ctx.arc(s.x,s.y,rPx,0,7);
      ctx.fillStyle='rgba(59,130,196,.16)'; ctx.fill();
      ctx.strokeStyle='rgba(59,130,196,.45)'; ctx.lineWidth=1.4; ctx.stroke();
    }
  }
  const col = gnss.fix===4 ? '#0e9f6e' : gnss.fix===5 ? '#e8a33d' : '#3b82c4';
  ctx.beginPath(); ctx.arc(s.x,s.y,15,0,7); ctx.fillStyle=hexA(col,.22); ctx.fill();
  ctx.beginPath(); ctx.arc(s.x,s.y,8,0,7);
  ctx.fillStyle=col; ctx.fill(); ctx.strokeStyle='#fff'; ctx.lineWidth=3; ctx.stroke();
  if(gnss.course!=null && isFinite(gnss.course)){
    const a=gnss.course*D2R;
    ctx.beginPath();
    ctx.moveTo(s.x+Math.sin(a)*20, s.y-Math.cos(a)*20);
    ctx.lineTo(s.x+Math.sin(a+2.6)*11, s.y-Math.cos(a+2.6)*11);
    ctx.lineTo(s.x+Math.sin(a-2.6)*11, s.y-Math.cos(a-2.6)*11);
    ctx.closePath(); ctx.fillStyle=col; ctx.fill();
  }
}

let dirty=false;
function draw(){
  if(dirty) return;
  dirty=true;
  requestAnimationFrame(()=>{
    dirty=false;
    ctx.clearRect(0,0,W,H);
    if(!drawTiles()) drawGridFallback();
    drawFeatures();
    drawCollecting();
    drawPosition();
  });
}

/* ---------- interação com o mapa ---------- */
const ptrs=new Map();
let panStart=null, moved=false, pinchStart=null, lastTap=0;

mapCv.addEventListener('pointerdown',e=>{
  mapCv.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1){
    panStart={x:e.clientX,y:e.clientY,lat:view.lat,lon:view.lon,cx:lon2x(view.lon,view.zoom),cy:lat2y(view.lat,view.zoom)};
    moved=false;
  } else if(ptrs.size===2){
    const [a,b]=[...ptrs.values()];
    pinchStart={
      d:Math.hypot(a.x-b.x,a.y-b.y), zoom:view.zoom,
      mx:(a.x+b.x)/2, my:(a.y+b.y)/2,
      lat:view.lat, lon:view.lon,
      cx:lon2x(view.lon,view.zoom), cy:lat2y(view.lat,view.zoom)
    };
  }
});

mapCv.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId)) return;
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});

  if(ptrs.size===1 && panStart && !pinchStart){
    const dx=e.clientX-panStart.x, dy=e.clientY-panStart.y;
    if(Math.hypot(dx,dy)>5) moved=true;
    if(moved){
      follow=false; updateFollowBtn();
      view.lon=x2lon(panStart.cx-dx,view.zoom);
      view.lat=y2lat(panStart.cy-dy,view.zoom);
      draw(); updateHud();
    }
  } else if(ptrs.size===2 && pinchStart){
    moved=true;
    const [a,b]=[...ptrs.values()];
    const d=Math.hypot(a.x-b.x,a.y-b.y);
    const mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
    const nz=clamp(pinchStart.zoom+Math.log2(d/Math.max(pinchStart.d,1)),3,19);
    const k=Math.pow(2,nz-pinchStart.zoom);
    const ncx=pinchStart.cx-(mx-pinchStart.mx)/k;
    const ncy=pinchStart.cy-(my-pinchStart.my)/k;
    view.zoom=nz;
    view.lon=x2lon(ncx,nz); view.lat=y2lat(ncy,nz);
    follow=false; updateFollowBtn();
    draw(); updateHud();
  }
});

function endPointer(e){
  if(!ptrs.has(e.pointerId)) return;
  ptrs.delete(e.pointerId);
  if(ptrs.size<2) pinchStart=null;
  if(ptrs.size===0){
    if(!moved && panStart){
      const now=Date.now();
      if(now-lastTap<300){ zoomBy(1); lastTap=0; }
      else { lastTap=now; handleMapTap(e.clientX,e.clientY); }
    }
    panStart=null;
  }
}
mapCv.addEventListener('pointerup',endPointer);
mapCv.addEventListener('pointercancel',endPointer);

function handleMapTap(cx,cy){
  const rect=mapCv.getBoundingClientRect();
  const sx=cx-rect.left, sy=cy-rect.top;
  const ll=toLatLon(sx,sy);

  if(collecting){
    collecting.coords.push([ll.lon,ll.lat,null]);
    updateCollectBar(); draw();
    toast('Vértice adicionado no mapa');
    return;
  }
  // seleciona feição próxima
  let best=null,bd=28;
  for(const f of state.features){
    const lay=layerOf(f.layerId); if(lay&&!lay.visible) continue;
    for(const p of f.coords){
      const s=toScreen(p[1],p[0]);
      const d=Math.hypot(s.x-sx,s.y-sy);
      if(d<bd){ bd=d; best=f; }
    }
  }
  if(best) featureMenu(best.id);
}

function zoomBy(dz){
  view.zoom=clamp(view.zoom+dz,3,19);
  draw(); updateHud();
}
function updateFollowBtn(){
  $('#btnFollow').classList.toggle('on',follow);
}
$$('#sideTools button').forEach(b=>{
  b.addEventListener('click',()=>{
    const k=b.dataset.tool;
    if(k==='in') zoomBy(1);
    else if(k==='out') zoomBy(-1);
    else if(k==='loc'){ follow=true; updateFollowBtn(); if(gnss.lat!=null){ view.lat=gnss.lat; view.lon=gnss.lon; draw(); } }
  });
});

function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2.5);
  W=mapCv.clientWidth; H=mapCv.clientHeight;
  mapCv.width=Math.round(W*DPR); mapCv.height=Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  draw();
}
window.addEventListener('resize',resize);

/* ══════════════════════════════════════════════════════════════
   8. HUD / ESCALA / ESTAQUEMENTO
   ══════════════════════════════════════════════════════════════ */
let hudT=null;
function scheduleHud(){ if(hudT) return; hudT=setTimeout(()=>{ hudT=null; updateHud(); },160); }

function updateHud(){
  const cs=currentCRS();
  if(gnss.lat!=null){
    $('#hudCoord').textContent=fmtXY(gnss.lat,gnss.lon,cs);
    $('#hudSub').textContent=`${nf(gnss.lat,7)}°, ${nf(gnss.lon,7)}° · alt ${nf(gnss.alt,2)} m · ±${nf(gnss.acc,2)} m`;
  } else {
    $('#hudCoord').textContent='—';
    $('#hudSub').textContent='aguardando sinal GNSS…';
  }
  // escala
  const m=mpp(), target=70*m;
  const nice=[1,2,5,10,20,50,100,200,500,1000,2000,5000].find(v=>v>=target)||5000;
  $('#scalebarLine').style.width=Math.round(nice/m)+'px';
  $('#scalebarText').textContent = nice>=1000 ? (nice/1000)+' km' : nice+' m';
  // estaqueamento
  updateStake();
}

let stakeTarget=null;
function updateStake(){
  const b=$('#stakeBanner');
  if(!stakeTarget || gnss.lat==null){ b.hidden=true; return; }
  const p=stakeTarget.coords[0];
  const cs=CRS.auto(gnss.lat,gnss.lon);
  const a=utmForward(gnss.lat,gnss.lon,cs.zone,cs.hemi);
  const c=utmForward(p[1],p[0],cs.zone,cs.hemi);
  const dN=c.n-a.n, dE=c.e-a.e;
  const dist=Math.hypot(dN,dE);
  const az=(Math.atan2(dE,dN)*R2D+360)%360;
  const dh=(p[2]!=null&&gnss.alt!=null)?p[2]-gnss.alt:null;
  b.hidden=false;
  $('#stakeDist').textContent=`${nf(dist,2)} m`;
  $('#stakeMeta').textContent=
    `Az ${nf(az,1)}° · ΔN ${nf(dN,2)} · ΔE ${nf(dE,2)}${dh!=null?` · Δh ${nf(dh,2)}`:''}`;
  $('#stakeArrow').style.transform=`rotate(${az}deg)`;
  if(dist<=state.settings.stakeTol){ $('#stakeDist').style.color='#0e9f6e'; }
  else $('#stakeDist').style.color='';
}
function clearStakeout(){ stakeTarget=null; updateStake(); toast('Estaqueamento encerrado'); }

/* ══════════════════════════════════════════════════════════════
   9. GNSS — interno, BLE (NMEA) e simulação
   ══════════════════════════════════════════════════════════════ */
const gnss={lat:null,lon:null,alt:null,acc:null,sats:null,hdop:null,fix:null,
            ts:0,source:'—',speed:null,course:null};
let firstFix=false;

const FIX_LABEL={
  0:{t:'SEM FIX',c:'none'},1:{t:'GPS',c:'gps'},2:{t:'DGPS',c:'dgps'},3:{t:'PPS',c:'dgps'},
  4:{t:'RTK FIX',c:'fix'},5:{t:'RTK FLOAT',c:'float'},6:{t:'ESTIMADO',c:'none'},
  7:{t:'MANUAL',c:'none'},8:{t:'SIMULADO',c:'gps'}
};

function updateGnss(p){
  Object.assign(gnss,p);
  const f=FIX_LABEL[gnss.fix]||FIX_LABEL[0];
  const pill=$('#fixPill');
  pill.className='pill '+f.c;
  $('#fixText').textContent=f.t;
  $('#statMini').textContent=
    `Sats ${gnss.sats??'—'} · HDOP ${gnss.hdop!=null?nf(gnss.hdop,1):'—'}`;

  if(gnss.lat!=null){
    if(!firstFix){ firstFix=true; if(follow){ view.lat=gnss.lat; view.lon=gnss.lon; } }
    if(follow){ view.lat=gnss.lat; view.lon=gnss.lon; }
  }
  draw(); scheduleHud();
}

/* ---- GPS interno ---- */
let geoWatch=null;
function startInternal(){
  stopSources();
  if(!navigator.geolocation){ toast('Geolocalização indisponível'); return; }
  updateGnss({source:'GPS interno'});
  geoWatch=navigator.geolocation.watchPosition(p=>{
    updateGnss({
      lat:p.coords.latitude, lon:p.coords.longitude,
      alt:p.coords.altitude, acc:p.coords.accuracy,
      fix:1, sats:null, hdop:null, ts:Date.now(), source:'GPS interno'
    });
  },err=>{
    toast('GPS: '+err.message);
    updateGnss({fix:0});
  },{
    enableHighAccuracy:true,
    maximumAge: state.settings.battery?3000:0,
    timeout:20000
  });
}

/* ---- BLE NMEA ---- */
let bleDevice=null, bleNotify=null, nmeaBuf='';
function bleSupported(){ return !!navigator.bluetooth; }

async function connectBLE(){
  if(!bleSupported()){ toast('Web Bluetooth indisponível (use Chrome no Android)'); return; }
  try{
    bleDevice=await navigator.bluetooth.requestDevice({
      acceptAllDevices:true,
      optionalServices:[
        '6e400001-b5a3-f393-e0a9-e50e24dcca9e',
        '0000ffe0-0000-1000-8000-00805f9b34fb',
        '000018f0-0000-1000-8000-00805f9b34fb'
      ]
    });
    bleDevice.addEventListener('gattserverdisconnected',()=>{
      toast('GNSS BLE desconectado');
      updateGnss({source:'—',fix:0});
      bleNotify=null; bleDevice=null;
    });
    const server=await bleDevice.gatt.connect();
    const services=await server.getPrimaryServices();
    for(const s of services){
      const chars=await s.getCharacteristics();
      for(const c of chars){
        if((c.properties.notify||c.properties.indicate) && !bleNotify){
          await c.startNotifications();
          c.addEventListener('characteristicvaluechanged',onNmea);
          bleNotify=c;
        }
      }
    }
    if(!bleNotify){ toast('Receptor sem canal de notificação NMEA'); return; }
    stopSources(true);
    updateGnss({source:bleDevice.name||'GNSS BLE'});
    toast('Conectado: '+(bleDevice.name||'GNSS BLE'));
    closeSheet();
  }catch(e){ toast('Falha BLE: '+e.message); }
}
function disconnectBLE(){
  try{ if(bleDevice) bleDevice.gatt.disconnect(); }catch(e){}
  bleDevice=null; bleNotify=null;
  updateGnss({source:'—',fix:0});
  toast('Desconectado');
}

function onNmea(ev){
  const buf=ev.target.value;
  nmeaBuf+=new TextDecoder().decode(new Uint8Array(buf.buffer||buf));
  let i;
  while((i=nmeaBuf.indexOf('\n'))>=0){
    const line=nmeaBuf.slice(0,i).trim();
    nmeaBuf=nmeaBuf.slice(i+1);
    if(line.charAt(0)==='$') parseNMEA(line);
  }
  if(nmeaBuf.length>4096) nmeaBuf='';
}

function nmeaCoord(v,hemi){
  if(!v) return null;
  const dot=v.indexOf('.');
  if(dot<3) return null;
  const d=parseFloat(v.slice(0,dot-2));
  const m=parseFloat(v.slice(dot-2));
  if(!isFinite(d)||!isFinite(m)) return null;
  let r=d+m/60;
  if(hemi==='S'||hemi==='W') r=-r;
  return r;
}

function parseNMEA(s){
  const body=s.slice(1).split('*')[0];
  const f=body.split(',');
  const kind=f[0].slice(2);
  const src=bleDevice?.name||'GNSS BLE';

  if(kind==='GGA'){
    const q=parseInt(f[6],10)||0;
    const lat=nmeaCoord(f[2],f[3]);
    const lon=nmeaCoord(f[4],f[5]);
    const patch={fix:q, sats:f[7]?parseInt(f[7],10):null,
                 hdop:f[8]?parseFloat(f[8]):null, source:src};
    if(lat!=null&&lon!=null&&q>0){
      patch.lat=lat; patch.lon=lon;
      patch.alt=f[9]?parseFloat(f[9]):null;
      patch.acc=(patch.hdop!=null && patch.hdop>0) ? patch.hdop*1.2 : (q>=4?0.02:q===5?0.2:q===2?1:3);
      patch.ts=Date.now();
    }
    updateGnss(patch);
  } else if(kind==='RMC' && f[8]){
    updateGnss({speed:f[7]?parseFloat(f[7])*1.852:null, course:parseFloat(f[8])});
  }
}

/* ---- simulação ---- */
let simT=null, simPos=null;
function startSim(){
  stopSources(true);
  simPos=simPos||{lat:-23.5505,lon:-46.6333,alt:760};
  let k=0;
  const tick=()=>{
    k+=0.06;
    simPos.lat+=Math.sin(k)*0.0000045;
    simPos.lon+=Math.cos(k*0.83)*0.0000045;
    updateGnss({lat:simPos.lat,lon:simPos.lon,alt:simPos.alt+Math.sin(k)*0.3,
      acc:0.014,fix:4,sats:24,hdop:0.6,ts:Date.now(),source:'Simulação'});
  };
  tick();
  simT=setInterval(tick, state.settings.battery?2000:1000);
  toast('Simulação GNSS ativa (RTK FIX)');
}

function stopSources(keepSim){
  if(geoWatch!=null){ navigator.geolocation.clearWatch(geoWatch); geoWatch=null; }
  if(simT){ clearInterval(simT); simT=null; }
}

let collecting=null;

function addFeature(f){
  f.id=f.id||uid();
  f.createdAt=f.createdAt||new Date().toISOString();
  f.quality=f.quality||{fix:gnss.fix,hdop:gnss.hdop,sats:gnss.sats,acc:gnss.acc};
  state.features.push(f);
  save(); draw();
  return f;
}
function deleteFeature(id){
  state.features=state.features.filter(f=>f.id!==id);
  if(stakeTarget && stakeTarget.id===id){ stakeTarget=null; updateStake(); }
  save(); draw();
}

function actPoint(){
  if(gnss.lat==null){ toast(t('Sem posição GNSS')); return; }
  openFeatureForm({
    type:'point',
    coords:[[gnss.lon,gnss.lat,gnss.alt]],
    name:'P'+(state.features.filter(f=>f.type==='point').length+1),
    code:'', layerId:state.layers[0].id, attrs:{}
  });
}
function actLine(){ startCollect('line'); }
function actPoly(){ startCollect('polygon'); }

function startCollect(type){
  collecting={type,coords:[],layerId:state.layers[0].id};
  if(gnss.lat!=null) collecting.coords.push([gnss.lon,gnss.lat,gnss.alt]);
  $('#actionbar').hidden=true;
  $('#collectbar').hidden=false;
  updateCollectBar(); draw();
  toast(type==='line'?'Linha: adicione vértices':'Polígono: adicione vértices');
}
function updateCollectBar(){
  if(!collecting) return;
  const n=collecting.coords.length;
  $('#collectInfo').textContent=
    (collecting.type==='line'?'Linha':'Polígono')+` — ${n} vértice${n===1?'':'s'}`;
}
function addVertex(){
  if(!collecting) return;
  if(gnss.lat==null){ toast(t('Sem posição GNSS')); return; }
  collecting.coords.push([gnss.lon,gnss.lat,gnss.alt]);
  updateCollectBar(); draw();
  if(navigator.vibrate) navigator.vibrate(12);
}
function undoVertex(){
  if(!collecting) return;
  collecting.coords.pop(); updateCollectBar(); draw();
}
function cancelCollect(){
  collecting=null;
  $('#actionbar').hidden=false;
  $('#collectbar').hidden=true;
  draw();
}
function finishCollect(){
  if(!collecting) return;
  const min=collecting.type==='line'?2:3;
  if(collecting.coords.length<min){
    toast(`Mínimo de ${min} vértices`); return;
  }
  const c=collecting;
  collecting=null;
  $('#actionbar').hidden=false;
  $('#collectbar').hidden=true;
  openFeatureForm({
    type:c.type, coords:c.coords, layerId:c.layerId,
    name:(c.type==='line'?'L':'A')+(state.features.length+1),
    code:'', attrs:{}
  });
  draw();
}

function fp(id){ return state.features.find(f=>f.id===id); }
function utmPt(f){ const c=f.coords[0]; const cs=CRS.auto(c[1],c[0]); return utmForward(c[1],c[0],cs.zone,cs.hemi); }
function utmCsOf(f){ const c=f.coords[0]; return CRS.auto(c[1],c[0]); }

function cogoInverse(){
  const a=fp($('#invA').value), b=fp($('#invB').value);
  if(!a||!b){ toast('Selecione dois pontos'); return; }
  const cs=utmCsOf(a);
  const A=utmForward(a.coords[0][1],a.coords[0][0],cs.zone,cs.hemi);
  const B=utmForward(b.coords[0][1],b.coords[0][0],cs.zone,cs.hemi);
  const dN=B.n-A.n, dE=B.e-A.e;
  const dist=Math.hypot(dN,dE);
  const az=(Math.atan2(dE,dN)*R2D+360)%360;
  const dh=(b.coords[0][2]!=null&&a.coords[0][2]!=null)?b.coords[0][2]-a.coords[0][2]:null;
  const geo=haversine(a.coords[0][1],a.coords[0][0],b.coords[0][1],b.coords[0][0]);
  const o=$('#invOut');
  o.hidden=false;
  o.textContent=
`De:      ${a.name}
Para:    ${b.name}
ΔN:      ${nf(dN,3)} m
ΔE:      ${nf(dE,3)} m
Distância (plana UTM): ${nf(dist,3)} m
Distância geodésica:   ${nf(geo,3)} m
Azimute: ${nf(az,4)}°  (${azDMS(az)})
Δh:      ${dh!=null?nf(dh,3)+' m':'—'}`;
}

function azDMS(az){
  const d=Math.floor(az), m=Math.floor((az-d)*60), s=(((az-d)*60)-m)*60;
  return `${d}°${String(m).padStart(2,'0')}'${nf(s,1)}"`;
}

function cogoForward(){
  const base=fp($('#polP').value);
  const az=parseFloat($('#polAz').value), d=parseFloat($('#polD').value);
  if(!base||!isFinite(az)||!isFinite(d)){ toast('Preencha base, azimute e distância'); return; }
  const cs=utmCsOf(base);
  const B=utmForward(base.coords[0][1],base.coords[0][0],cs.zone,cs.hemi);
  const e=B.e+Math.sin(az*D2R)*d;
  const n=B.n+Math.cos(az*D2R)*d;
  const ll=utmInverse(e,n,cs.zone,cs.hemi);
  const f=addFeature({
    type:'point', layerId:base.layerId,
    name:$('#polName').value.trim()||'COGO',
    code:'COGO', attrs:{origem:base.name, azimute:String(az), distancia:String(d)},
    coords:[[ll.lon,ll.lat,base.coords[0][2]]]
  });
  toast('Ponto criado: '+f.name);
  draw(); cogoInverse();
  $('#polName').value='COGO-'+(state.features.filter(x=>x.code==='COGO').length+1);
}

function cogoBB(){
  const p1=fp($('#bbP1').value), p2=fp($('#bbP2').value);
  const a1=parseFloat($('#bbA1').value)*D2R, a2=parseFloat($('#bbA2').value)*D2R;
  if(!p1||!p2||!isFinite(a1)||!isFinite(a2)){ toast('Preencha os dados'); return; }
  const cs=utmCsOf(p1);
  const A=utmForward(p1.coords[0][1],p1.coords[0][0],cs.zone,cs.hemi);
  const B=utmForward(p2.coords[0][1],p2.coords[0][0],cs.zone,cs.hemi);
  // retas: A + t*(sin a1, cos a1) ; B + u*(sin a2, cos a2)
  const d1x=Math.sin(a1), d1y=Math.cos(a1), d2x=Math.sin(a2), d2y=Math.cos(a2);
  const den=d1x*d2y-d1y*d2x;
  const o=$('#bbOut'); o.hidden=false;
  if(Math.abs(den)<1e-12){ o.textContent='Retas paralelas — sem interseção.'; return; }
  const dx=B.e-A.e, dy=B.n-A.n;
  const t=(dx*d2y-dy*d2x)/den;
  const e=A.e+t*d1x, n=A.n+t*d1y;
  const ll=utmInverse(e,n,cs.zone,cs.hemi);
  o.textContent=
`Interseção encontrada:
E: ${nf(e,3)}  N: ${nf(n,3)}
Lat: ${nf(ll.lat,8)}  Lon: ${nf(ll.lon,8)}
Distância de ${p1.name}: ${nf(Math.hypot(e-A.e,n-A.n),3)} m
Distância de ${p2.name}: ${nf(Math.hypot(e-B.e,n-B.n),3)} m`;
  window.__lastCogo={lat:ll.lat,lon:ll.lon,cs};
  o.innerHTML+=`\n<button class="btn primary" style="margin-top:8px;color:#fff" onclick="saveCogoPoint()">Salvar como ponto</button>`;
  o.style.whiteSpace='pre-wrap';
}

function cogoDD(){
  const p1=fp($('#ddP1').value), p2=fp($('#ddP2').value);
  const r1=parseFloat($('#ddD1').value), r2=parseFloat($('#ddD2').value);
  const o=$('#ddOut'); o.hidden=false;
  if(!p1||!p2||!isFinite(r1)||!isFinite(r2)){ o.textContent='Preencha os dados.'; return; }
  const cs=utmCsOf(p1);
  const A=utmForward(p1.coords[0][1],p1.coords[0][0],cs.zone,cs.hemi);
  const B=utmForward(p2.coords[0][1],p2.coords[0][0],cs.zone,cs.hemi);
  const dx=B.e-A.e, dy=B.n-A.n, d=Math.hypot(dx,dy);
  if(d<1e-9){ o.textContent='Pontos coincidentes.'; return; }
  if(d>r1+r2||d<Math.abs(r1-r2)){ o.textContent='Sem interseção com essas distâncias.'; return; }
  const a=(r1*r1-r2*r2+d*d)/(2*d);
  const h=Math.sqrt(Math.max(0,r1*r1-a*a));
  const mx=A.e+dx*a/d, my=A.n+dy*a/d;
  const e1=mx+h*(-dy/d), n1=my+h*(dx/d);
  const e2=mx-h*(-dy/d), n2=my-h*(dx/d);
  const l1=utmInverse(e1,n1,cs.zone,cs.hemi);
  const l2=utmInverse(e2,n2,cs.zone,cs.hemi);
  o.textContent=
`Solução 1: E ${nf(e1,3)}  N ${nf(n1,3)}
           Lat ${nf(l1.lat,8)}  Lon ${nf(l1.lon,8)}
Solução 2: E ${nf(e2,3)}  N ${nf(n2,3)}
           Lat ${nf(l2.lat,8)}  Lon ${nf(l2.lon,8)}`;
  window.__lastCogo={lat:l1.lat,lon:l1.lon,cs};
  o.innerHTML+=`\n<button class="btn primary" style="margin-top:8px;color:#fff" onclick="saveCogoPoint()">Salvar solução 1</button>`;
  o.style.whiteSpace='pre-wrap';
}

function saveCogoPoint(){
  const c=window.__lastCogo;
  if(!c) return;
  addFeature({
    type:'point', layerId:state.layers[0].id,
    name:'COGO-'+(state.features.length+1), code:'COGO', attrs:{},
    coords:[[c.lon,c.lat,null]]
  });
  draw(); toast('Ponto salvo');
  window.__lastCogo=null;
}

function cogoArea(){
  const f=fp($('#areaPoly').value);
  const o=$('#areaOut'); o.hidden=false;
  if(!f){ o.textContent='Nenhum polígono disponível.'; return; }
  const m=polygonMetrics(f.coords);
  const c=f.coords.reduce((a,p)=>[a[0]+p[0],a[1]+p[1]],[0,0]).map(v=>v/f.coords.length);
  o.textContent=
`Polígono: ${f.name}
Área:      ${nf(m.area,2)} m²
Área:      ${nf(m.area/10000,4)} ha
Perímetro: ${nf(m.perimeter,2)} m
Centroide: ${nf(c[1],8)}, ${nf(c[0],8)}`;
}

function download(blob, name){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=name;
  document.body.appendChild(a);
  a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 4000);
}

function expCSV(){
  const cs=currentCRS();
  const sep=';';
  const head=['id','nome','codigo','camada','tipo','lat','lon','altitude','E','N','fix','hdop','sats','data'];
  const lines=[head.join(sep)];
  for(const f of state.features){
    const p=f.coords[0];
    const xy=toXY(p[1],p[0],cs);
    lines.push([
      f.id, csvEsc(f.name), csvEsc(f.code), csvEsc(layerOf(f.layerId)?.name||''),
      f.type, p[1].toFixed(9), p[0].toFixed(9), p[2]!=null?p[2].toFixed(3):'',
      xy.x.toFixed(4), xy.y.toFixed(4),
      f.quality?.fix??'', f.quality?.hdop??'', f.quality?.sats??'', f.createdAt
    ].join(sep));
  }
  download(new Blob(['\ufeff'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'}), 'levantamento.csv');
  toast('CSV exportado');
}
function csvEsc(s){ s=String(s??''); return /[;"\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; }

function expKML(){
  const lay=id=>layerOf(id);
  const placemarks=state.features.map(f=>{
    const l=lay(f.layerId);
    const coords=f.coords.map(p=>`${p[0]},${p[1]},${p[2]??0}`).join(' ');
    const desc=`Código: ${esc(f.code)||'—'} | Camada: ${esc(l?.name||'')} | Fix: ${f.quality?.fix??'—'}`;
    if(f.type==='point'){
      return `<Placemark><name>${esc(f.name)}</name><description>${desc}</description>
        <styleUrl>#pt${l?.id||''}</styleUrl>
        <Point><coordinates>${coords}</coordinates></Point></Placemark>`;
    }
    if(f.type==='line'){
      return `<Placemark><name>${esc(f.name)}</name><description>${desc}</description>
        <LineString><tessellate>1</tessellate><coordinates>${coords}</coordinates></LineString></Placemark>`;
    }
    return `<Placemark><name>${esc(f.name)}</name><description>${desc}</description>
      <Polygon><outerBoundaryIs><LinearRing><coordinates>${coords} ${f.coords[0][0]},${f.coords[0][1]},${f.coords[0][2]??0}</coordinates></LinearRing></outerBoundaryIs></Polygon></Placemark>`;
  }).join('\n');

  const styles=state.layers.map(l=>`
    <Style id="pt${l.id}"><IconStyle><color>ff${l.color.slice(5,7)}${l.color.slice(3,5)}${l.color.slice(1,3)}</color>
    <scale>1.1</scale><Icon><href>http://maps.google.com/mapfiles/kml/shapes/placemark_circle.png</href></Icon></IconStyle>
    <LineStyle><color>ff${l.color.slice(5,7)}${l.color.slice(3,5)}${l.color.slice(1,3)}</color><width>2</width></LineStyle>
    </Style>`).join('\n');

  const kml=`<?xml version="1.0" encoding="UTF-8"?>
<kml xmlns="http://www.opengis.net/kml/2.2"><Document>
<name>Levantamento TopoGNSS</name>
${styles}
${placemarks}
</Document></kml>`;
  download(new Blob([kml],{type:'application/vnd.google-earth.kml+xml'}),'levantamento.kml');
  toast('KML exportado');
}

function expGPX(){
  const wpts=state.features.filter(f=>f.type==='point').map(f=>{
    const p=f.coords[0];
    return `<wpt lat="${p[1].toFixed(9)}" lon="${p[0].toFixed(9)}">
      <ele>${(p[2]??0).toFixed(3)}</ele><name>${esc(f.name)}</name>
      <desc>${esc(f.code)}</desc></wpt>`;
  }).join('\n');
  const trks=state.features.filter(f=>f.type!=='point').map(f=>{
    const pts=f.coords.map(p=>`<trkpt lat="${p[1].toFixed(9)}" lon="${p[0].toFixed(9)}"><ele>${(p[2]??0).toFixed(3)}</ele></trkpt>`).join('\n');
    return `<trk><name>${esc(f.name)}</name><trkseg>${pts}</trkseg></trk>`;
  }).join('\n');
  const gpx=`<?xml version="1.0" encoding="UTF-8"?>
<gpx version="1.1" creator="TopoGNSS" xmlns="http://www.topografix.com/GPX/1/1">
${wpts}
${trks}
</gpx>`;
  download(new Blob([gpx],{type:'application/gpx+xml'}),'levantamento.gpx');
  toast('GPX exportado');
}

function expGeoJSON(){
  const feats=state.features.map(f=>{
    let geom;
    if(f.type==='point') geom={type:'Point',coordinates:[f.coords[0][0],f.coords[0][1],f.coords[0][2]??0]};
    else if(f.type==='line') geom={type:'LineString',coordinates:f.coords.map(p=>[p[0],p[1],p[2]??0])};
    else{
      const ring=f.coords.map(p=>[p[0],p[1],p[2]??0]);
      ring.push(ring[0]);
      geom={type:'Polygon',coordinates:[ring]};
    }
    return {type:'Feature',geometry:geom,properties:{
      nome:f.name, codigo:f.code, camada:layerOf(f.layerId)?.name||'',
      tipo:f.type, fix:f.quality?.fix??null, data:f.createdAt, ...(f.attrs||{})
    }};
  });
  download(new Blob([JSON.stringify({type:'FeatureCollection',features:feats},null,1)],
    {type:'application/geo+json'}),'levantamento.geojson');
  toast('GeoJSON exportado');
}

function expDXF(){
  const cs=currentCRS();
  const num=v=>Number(v).toFixed(4);
  const L=[];
  const push=(...a)=>a.forEach(x=>L.push(String(x)));

  push(0,'SECTION',2,'HEADER',9,'$INSUNITS',70,6,0,'ENDSEC');
  push(0,'SECTION',2,'TABLES',0,'TABLE',2,'LAYER',70,state.layers.length+1);
  push(0,'LAYER',2,'0',70,0,62,7,6,'CONTINUOUS');
  state.layers.forEach((l,i)=>{
    push(0,'LAYER',2,dxfName(l.name),70,0,62,7+i,6,'CONTINUOUS');
  });
  push(0,'ENDTAB',0,'ENDSEC');
  push(0,'SECTION',2,'ENTITIES');

  for(const f of state.features){
    const lay=dxfName(layerOf(f.layerId)?.name||'0');
    const pts=f.coords.map(p=>{
      const xy=toXY(p[1],p[0],cs);
      return {x:xy.x,y:xy.y,z:p[2]??0};
    });
    if(f.type==='point'){
      push(0,'POINT',8,lay,10,num(pts[0].x),20,num(pts[0].y),30,num(pts[0].z));
      push(0,'TEXT',8,lay,10,num(pts[0].x+0.8),20,num(pts[0].y+0.8),30,'0',
           40,'1.2',1,f.name);
    } else {
      push(0,'POLYLINE',8,lay,66,1,70,f.type==='polygon'?1:0,
           10,'0',20,'0',30,'0');
      pts.forEach(p=>{
        push(0,'VERTEX',8,lay,10,num(p.x),20,num(p.y),30,num(p.z),70,0);
      });
      push(0,'SEQEND',8,lay);
      push(0,'TEXT',8,lay,10,num(pts[0].x+0.8),20,num(pts[0].y+0.8),30,'0',
           40,'1.2',1,f.name);
    }
  }
  push(0,'ENDSEC',0,'EOF');

  download(new Blob([L.join('\r\n')],{type:'application/dxf'}),'levantamento.dxf');
  toast('DXF exportado ('+currentCRS().name+')');
}
function dxfName(s){
  return String(s||'0').toUpperCase().replace(/[^A-Z0-9_\-]/g,'_').slice(0,31)||'0';
}

/* ---------- ZIP (store) ---------- */
const CRC_TABLE=(()=>{
  const t=new Uint32Array(256);
  for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1); t[n]=c>>>0; }
  return t;
})();
function crc32(buf){
  let c=0xFFFFFFFF;
  for(let i=0;i<buf.length;i++) c=CRC_TABLE[(c^buf[i])&0xFF]^(c>>>8);
  return (c^0xFFFFFFFF)>>>0;
}
function zipStore(files){
  const enc=new TextEncoder();
  const parts=[], central=[];
  let offset=0;
  for(const f of files){
    const nb=enc.encode(f.name);
    const data=f.data;
    const crc=crc32(data);
    const size=data.length;
    const lh=new Uint8Array(30+nb.length);
    const dv=new DataView(lh.buffer);
    dv.setUint32(0,0x04034b50,true);
    dv.setUint16(4,20,true);
    dv.setUint16(8,0,true);
    dv.setUint32(14,crc,true);
    dv.setUint32(18,size,true);
    dv.setUint32(22,size,true);
    dv.setUint16(26,nb.length,true);
    lh.set(nb,30);
    parts.push(lh,data);

    const ch=new Uint8Array(46+nb.length);
    const dv2=new DataView(ch.buffer);
    dv2.setUint32(0,0x02014b50,true);
    dv2.setUint16(4,20,true);
    dv2.setUint16(6,20,true);
    dv2.setUint32(16,crc,true);
    dv2.setUint32(20,size,true);
    dv2.setUint32(24,size,true);
    dv2.setUint16(28,nb.length,true);
    dv2.setUint32(42,offset,true);
    ch.set(nb,46);
    central.push(ch);
    offset+=lh.length+size;
  }
  let cdSize=0; central.forEach(c=>cdSize+=c.length);
  const eocd=new Uint8Array(22);
  const dv3=new DataView(eocd.buffer);
  dv3.setUint32(0,0x06054b50,true);
  dv3.setUint16(8,files.length,true);
  dv3.setUint16(10,files.length,true);
  dv3.setUint32(12,cdSize,true);
  dv3.setUint32(16,offset,true);
  return new Blob([...parts,...central,eocd],{type:'application/zip'});
}

/* ---------- Shapefile ---------- */
const PRJ_WGS84='GEOGCS["GCS_WGS_1984",DATUM["D_WGS_1984",SPHEROID["WGS_1984",6378137.0,298.257223563]],PRIMEM["Greenwich",0.0],UNIT["Degree",0.0174532925199433]]';

function expSHP(){
  try{
    const files=[];
    const groups={
      pontos:  state.features.filter(f=>f.type==='point'),
      linhas:  state.features.filter(f=>f.type==='line'),
      poligonos:state.features.filter(f=>f.type==='polygon')
    };
    const types={pontos:11, linhas:13, poligonos:15};
    for(const [base,arr] of Object.entries(groups)){
      if(!arr.length) continue;
      const {shp,shx}=buildSHP(arr, types[base]);
      files.push({name:base+'.shp',data:shp});
      files.push({name:base+'.shx',data:shx});
      files.push({name:base+'.dbf',data:buildDBF(arr)});
      files.push({name:base+'.prj',data:new TextEncoder().encode(PRJ_WGS84)});
    }
    if(!files.length){ toast('Nada para exportar'); return; }
    download(zipStore(files),'levantamento_shp.zip');
    toast('Shapefile exportado');
  }catch(e){ toast('Erro ao gerar Shapefile: '+e.message); }
}

function buildSHP(arr, shapeType){
  const contents=arr.map(f=>shapeContent(f,shapeType));
  const total=100+contents.reduce((s,c)=>s+8+c.length,0);
  const buf=new Uint8Array(total);
  const dv=new DataView(buf.buffer);

  let xmin=Infinity,ymin=Infinity,xmax=-Infinity,ymax=-Infinity;
  let zmin=Infinity,zmax=-Infinity;
  arr.forEach(f=>f.coords.forEach(p=>{
    if(p[0]<xmin)xmin=p[0]; if(p[0]>xmax)xmax=p[0];
    if(p[1]<ymin)ymin=p[1]; if(p[1]>ymax)ymax=p[1];
    const z=p[2]??0; if(z<zmin)zmin=z; if(z>zmax)zmax=z;
  }));
  if(!isFinite(xmin)){ xmin=ymin=xmax=ymax=zmin=zmax=0; }

  dv.setInt32(0,9994,false);
  dv.setInt32(24,total/2,false);
  dv.setInt32(28,1000,true);
  dv.setInt32(32,shapeType,true);
  dv.setFloat64(36,xmin,true); dv.setFloat64(44,ymin,true);
  dv.setFloat64(52,xmax,true); dv.setFloat64(60,ymax,true);
  dv.setFloat64(68,zmin,true); dv.setFloat64(76,zmax,true);
  dv.setFloat64(84,0,true);    dv.setFloat64(92,0,true);

  const offsets=[];
  let pos=100;
  contents.forEach((c,i)=>{
    offsets.push({off:pos, len:c.length});
    dv.setInt32(pos,i+1,false);
    dv.setInt32(pos+4,c.length/2,false);
    buf.set(c,pos+8);
    pos+=8+c.length;
  });

  // SHX
  const shxBuf=new Uint8Array(100+8*contents.length);
  shxBuf.set(buf.subarray(0,100),0);
  const dvx=new DataView(shxBuf.buffer);
  dvx.setInt32(24,(100+8*contents.length)/2,false);
  offsets.forEach((o,i)=>{
    dvx.setInt32(100+i*8,o.off/2,false);
    dvx.setInt32(104+i*8,o.len/2,false);
  });

  return {shp:buf, shx:shxBuf};
}

function shapeContent(f, shapeType){
  const coords=f.coords;
  if(shapeType===11){
    const b=new Uint8Array(4+8*4);
    const dv=new DataView(b.buffer);
    dv.setInt32(0,11,true);
    dv.setFloat64(4,coords[0][0],true);
    dv.setFloat64(12,coords[0][1],true);
    dv.setFloat64(20,coords[0][2]??0,true);
    dv.setFloat64(28,0,true);
    return b;
  }
  // PolyLineZ (13) / PolygonZ (15)
  let pts=coords.map(p=>[p[0],p[1],p[2]??0]);
  if(shapeType===15){
    // anel externo deve ser horário
    let s=0;
    for(let i=0;i<pts.length;i++){
      const j=(i+1)%pts.length;
      s+=pts[i][0]*pts[j][1]-pts[j][0]*pts[i][1];
    }
    if(s>0) pts=pts.slice().reverse();
    pts=pts.concat([pts[0]]);
  }
  const n=pts.length;
  const size=4+32+8+4+16*n+16+8*n+16+8*n;
  const b=new Uint8Array(size);
  const dv=new DataView(b.buffer);
  let o=0;
  dv.setInt32(o,shapeType,true); o+=4;

  let xmin=Infinity,ymin=Infinity,xmax=-Infinity,ymax=-Infinity,zmin=Infinity,zmax=-Infinity;
  pts.forEach(p=>{
    if(p[0]<xmin)xmin=p[0]; if(p[0]>xmax)xmax=p[0];
    if(p[1]<ymin)ymin=p[1]; if(p[1]>ymax)ymax=p[1];
    if(p[2]<zmin)zmin=p[2]; if(p[2]>zmax)zmax=p[2];
  });
  dv.setFloat64(o,xmin,true); o+=8;
  dv.setFloat64(o,ymin,true); o+=8;
  dv.setFloat64(o,xmax,true); o+=8;
  dv.setFloat64(o,ymax,true); o+=8;
  dv.setInt32(o,1,true); o+=4;   // numParts
  dv.setInt32(o,n,true); o+=4;   // numPoints
  dv.setInt32(o,0,true); o+=4;   // parts[0]
  pts.forEach(p=>{ dv.setFloat64(o,p[0],true); o+=8; dv.setFloat64(o,p[1],true); o+=8; });
  dv.setFloat64(o,zmin,true); o+=8;
  dv.setFloat64(o,zmax,true); o+=8;
  pts.forEach(p=>{ dv.setFloat64(o,p[2],true); o+=8; });
  dv.setFloat64(o,0,true); o+=8;
  dv.setFloat64(o,0,true); o+=8;
  pts.forEach(()=>{ dv.setFloat64(o,0,true); o+=8; });
  return b;
}

function buildDBF(arr){
  const fields=[
    {n:'ID',t:'N',l:10,d:0},
    {n:'NOME',t:'C',l:50,d:0},
    {n:'CODIGO',t:'C',l:20,d:0},
    {n:'CAMADA',t:'C',l:30,d:0},
    {n:'TIPO',t:'C',l:10,d:0},
    {n:'ALTITUDE',t:'N',l:12,d:3},
    {n:'DATA',t:'C',l:20,d:0}
  ];
  const recLen=1+fields.reduce((s,f)=>s+f.l,0);
  const headLen=32+fields.length*32+1;
  const total=headLen+recLen*arr.length+1;
  const b=new Uint8Array(total);
  const dv=new DataView(b.buffer);
  const now=new Date();

  dv.setUint8(0,0x03);
  dv.setUint8(1,now.getFullYear()-1900);
  dv.setUint8(2,now.getMonth()+1);
  dv.setUint8(3,now.getDate());
  dv.setUint32(4,arr.length,true);
  dv.setUint16(8,headLen,true);
  dv.setUint16(10,recLen,true);

  let p=32;
  const enc=new TextEncoder();
  fields.forEach(f=>{
    const nb=enc.encode(f.n.padEnd(11,'\0').slice(0,11));
    b.set(nb,p);
    b[p+11]=f.t.charCodeAt(0);
    b[p+16]=f.l;
    b[p+17]=f.d;
    p+=32;
  });
  b[p]=0x0D; p++;

  arr.forEach(f=>{
    b[p]=0x20; p++;
    const write=(str,len,right)=>{
      let s=String(str??'').slice(0,len);
      s=right?s.padStart(len,' '):s.padEnd(len,' ');
      b.set(enc.encode(s),p); p+=len;
    };
    write(f.id||'',10,true);
    write(f.name||'',50,false);
    write(f.code||'',20,false);
    write(layerOf(f.layerId)?.name||'',30,false);
    write(f.type,10,false);
    write(f.coords[0][2]!=null?Number(f.coords[0][2]).toFixed(3):'',12,true);
    write(f.createdAt?f.createdAt.slice(0,19).replace('T',' '):'',20,false);
  });
  b[p]=0x1A;
  return b;
}

/* ---------- Importação ---------- */
function doImport(){
  const file=$('#impFile').files[0];
  if(!file){ toast('Selecione um arquivo'); return; }
  const reader=new FileReader();
  reader.onload=()=>{
    const txt=String(reader.result);
    const ext=file.name.split('.').pop().toLowerCase();
    let added=0;
    try{
      if(ext==='csv'||ext==='txt') added=importCSV(txt);
      else if(ext==='kml') added=importKML(txt);
      else if(ext==='gpx') added=importGPX(txt);
      else if(ext==='geojson'||ext==='json') added=importGeoJSON(txt);
      else toast('Formato não suportado');
    }catch(e){ toast('Erro: '+e.message); }
    if(added){ save(); draw(); toast(added+' feição(ões) importada(s)'); closeSheet(); }
  };
  reader.readAsText(file);
}

function detectSep(line){
  const c=[[',',(line.match(/,/g)||[]).length],[';',(line.match(/;/g)||[]).length],['\t',(line.match(/\t/g)||[]).length]];
  c.sort((a,b)=>b[1]-a[1]);
  return c[0][1]>0?c[0][0]:';';
}
function importCSV(txt){
  const lines=txt.replace(/^\ufeff/,'').split(/\r?\n/).filter(l=>l.trim());
  if(!lines.length) return 0;
  const sep=detectSep(lines[0]);
  const head=lines[0].split(sep).map(s=>s.trim().toLowerCase().replace(/"/g,''));
  const idx=(...names)=>head.findIndex(h=>names.some(n=>h===n||h.includes(n)));
  const iLat=idx('lat','latitude','y');
  const iLon=idx('lon','long','lng','x');
  if(iLat<0||iLon<0){ toast('CSV precisa de colunas lat/lon'); return 0; }
  const iName=idx('nome','name','ponto','id');
  const iCode=idx('codigo','código','code');
  const iAlt=idx('alt','elev','z');
  const iLay=idx('camada','layer');

  let n=0;
  for(let i=1;i<lines.length;i++){
    const c=lines[i].split(sep).map(s=>s.replace(/^"|"$/g,'').trim());
    const lat=parseFloat(c[iLat]), lon=parseFloat(c[iLon]);
    if(!isFinite(lat)||!isFinite(lon)) continue;
    const alt=iAlt>=0?parseFloat(c[iAlt]):null;
    let layerId=state.layers[0].id;
    if(iLay>=0&&c[iLay]){
      let l=state.layers.find(x=>x.name.toLowerCase()===c[iLay].toLowerCase());
      if(!l){ l={id:uid(),name:c[iLay],color:PALETTE[state.layers.length%PALETTE.length],visible:true}; state.layers.push(l); }
      layerId=l.id;
    }
    addFeature({
      type:'point', layerId,
      name:iName>=0&&c[iName]?c[iName]:'IMP-'+(state.features.length+1),
      code:iCode>=0?c[iCode]:'',
      attrs:{}, coords:[[lon,lat,isFinite(alt)?alt:null]]
    });
    n++;
  }
  return n;
}

function importKML(txt){
  const doc=new DOMParser().parseFromString(txt,'text/xml');
  let n=0;
  doc.querySelectorAll('Placemark').forEach(pm=>{
    const name=pm.querySelector('name')?.textContent||'KML-'+(state.features.length+1);
    const pt=pm.querySelector('Point coordinates');
    const ls=pm.querySelector('LineString coordinates');
    const pg=pm.querySelector('Polygon outerBoundaryIs LinearRing coordinates');
    const parse=s=>s.trim().split(/\s+/).map(t=>{
      const a=t.split(',').map(Number);
      return [a[0],a[1],isFinite(a[2])?a[2]:null];
    }).filter(p=>isFinite(p[0])&&isFinite(p[1]));
    if(pt){ const c=parse(pt.textContent); if(c.length) { addFeature({type:'point',layerId:state.layers[0].id,name,code:'',attrs:{},coords:[c[0]]}); n++; } }
    else if(ls){ const c=parse(ls.textContent); if(c.length>1){ addFeature({type:'line',layerId:state.layers[0].id,name,code:'',attrs:{},coords:c}); n++; } }
    else if(pg){ const c=parse(pg.textContent); if(c.length>2){ addFeature({type:'polygon',layerId:state.layers[0].id,name,code:'',attrs:{},coords:c}); n++; } }
  });
  return n;
}

function importGPX(txt){
  const doc=new DOMParser().parseFromString(txt,'text/xml');
  let n=0;
  doc.querySelectorAll('wpt').forEach(w=>{
    const lat=parseFloat(w.getAttribute('lat')), lon=parseFloat(w.getAttribute('lon'));
    if(!isFinite(lat)||!isFinite(lon)) return;
    addFeature({type:'point',layerId:state.layers[0].id,
      name:w.querySelector('name')?.textContent||'WPT',
      code:w.querySelector('desc')?.textContent||'',attrs:{},
      coords:[[lon,lat,parseFloat(w.querySelector('ele')?.textContent)||null]]});
    n++;
  });
  doc.querySelectorAll('trk').forEach(t=>{
    const pts=[...t.querySelectorAll('trkpt')].map(p=>[
      parseFloat(p.getAttribute('lon')),parseFloat(p.getAttribute('lat')),
      parseFloat(p.querySelector('ele')?.textContent)||null
    ]).filter(p=>isFinite(p[0])&&isFinite(p[1]));
    if(pts.length>1){
      addFeature({type:'line',layerId:state.layers[0].id,
        name:t.querySelector('name')?.textContent||'TRK',code:'',attrs:{},coords:pts});
      n++;
    }
  });
  return n;
}

function importGeoJSON(txt){
  const j=JSON.parse(txt);
  const feats=j.type==='FeatureCollection'?j.features:[j];
  let n=0;
  feats.forEach(f=>{
    const g=f.geometry; if(!g) return;
    const props=f.properties||{};
    const name=props.nome||props.name||'GEO-'+(state.features.length+1);
    const code=props.codigo||props.code||'';
    const conv=c=>[c[0],c[1],c[2]??null];
    if(g.type==='Point'){ addFeature({type:'point',layerId:state.layers[0].id,name,code,attrs:props,coords:[conv(g.coordinates)]}); n++; }
    else if(g.type==='LineString'&&g.coordinates.length>1){ addFeature({type:'line',layerId:state.layers[0].id,name,code,attrs:props,coords:g.coordinates.map(conv)}); n++; }
    else if(g.type==='Polygon'){
      const ring=g.coordinates[0].map(conv);
      if(ring.length>3){ addFeature({type:'polygon',layerId:state.layers[0].id,name,code,attrs:props,coords:ring.slice(0,-1)}); n++; }
    }
  });
  return n;
}

/* ══════════════════════════════════════════════════════════════
   16. INICIALIZAÇÃO
   ══════════════════════════════════════════════════════════════ */
function applyI18n(){
  // rótulos estáticos
  document.querySelectorAll('.abtn span').forEach((s,i)=>{
    const keys=['Ponto','Linha','Polígono','Dados','Mais'];
    s.textContent=t(keys[i]);
  });
  updateHud();
}

async function boot(){
  applyTheme();
  await openIDB();
  resize();
  applyI18n();
  updateFollowBtn();
  updateHud();

  // fonte GNSS inicial
  if(state.settings.sim) startSim();
  else if(state.settings.gpsSource==='internal') startInternal();

  // offline / online
  window.addEventListener('online',()=>toast('Online — cache de mapa ativo'));
  window.addEventListener('offline',()=>toast('Offline — usando mapa em cache'));

  // salva ao sair
  window.addEventListener('beforeunload',()=>{
    try{ localStorage.setItem(DB_KEY, JSON.stringify(state)); }catch(e){}
  });

  if(!state.features.length){
    setTimeout(()=>toast('Toque em Ponto para iniciar o levantamento', 3600), 900);
  }
}

boot();
